<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>valley sim</title>

<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="valley sim">
<meta name="theme-color" content="#faf5ec">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf5ec; --paper:#fffdf8; --ink:#3a2f28;
    --terra:#c96f4a; --terra-deep:#a85434; --sage:#7d8b6f; --gold:#d9a441;
    --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px); --sal:env(safe-area-inset-left,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#f2efe0;
    position:fixed;width:100%;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;}
  #scene{position:absolute;inset:0;z-index:1;display:block;}

  #title-card{
    position:absolute;top:calc(14px + var(--sat));left:calc(14px + var(--sal));z-index:10;
    background:rgba(255,253,248,.9);backdrop-filter:blur(6px);border-radius:16px;
    padding:11px 17px 9px;box-shadow:0 2px 14px rgba(58,47,40,.14), 0 0 0 1px rgba(58,47,40,.05);
    pointer-events:none;
  }
  #title-card h1{font-family:'Fraunces',serif;font-weight:600;font-size:24px;letter-spacing:-.02em;color:var(--ink);line-height:1;}
  #title-card h1 em{color:var(--terra);font-style:italic;}
  #title-card p{font-size:10px;color:#a3938a;margin-top:4px;letter-spacing:.05em;}

  #found{
    position:absolute;top:calc(14px + var(--sat));right:calc(14px + var(--sar));z-index:10;
    background:rgba(255,253,248,.9);backdrop-filter:blur(6px);border-radius:14px;padding:9px 15px;
    box-shadow:0 2px 14px rgba(58,47,40,.14), 0 0 0 1px rgba(58,47,40,.05);
    font-size:11px;color:#7c6d63;text-align:center;pointer-events:none;
  }
  #found b{font-family:'Fraunces',serif;font-size:17px;color:var(--terra-deep);font-weight:600;}

  #toast{
    position:absolute;top:calc(118px + var(--sat));left:50%;transform:translateX(-50%) translateY(-8px);z-index:12;
    background:var(--paper);border-radius:14px;padding:10px 20px;
    box-shadow:0 4px 18px rgba(58,47,40,.18), 0 0 0 1px rgba(58,47,40,.05);
    font-family:'Fraunces',serif;font-size:16px;font-style:italic;color:var(--terra-deep);
    opacity:0;pointer-events:none;transition:opacity .45s, transform .45s;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast span{display:block;font-family:'Inter',sans-serif;font-style:normal;font-size:10px;color:#a3938a;
    letter-spacing:.08em;text-transform:uppercase;margin-top:2px;text-align:center;}

  #bubble{
    position:absolute;z-index:9;left:-200px;top:-200px;transform:translate(-50%,-100%);
    background:var(--paper);border-radius:12px;padding:6px 13px;
    font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:#6b5a4e;
    box-shadow:0 2px 10px rgba(58,47,40,.14), 0 0 0 1px rgba(58,47,40,.05);
    opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .35s;
  }
  #bubble::after{content:'';position:absolute;left:50%;bottom:-5px;width:10px;height:10px;
    background:var(--paper);transform:translateX(-50%) rotate(45deg);box-shadow:1px 1px 0 rgba(58,47,40,.05);}
  #bubble.show{opacity:1;}

  #vignette{position:absolute;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 60%, rgba(120,85,50,.14) 100%);}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="title-card"><h1>valley <em>sim</em></h1><p>he wanders on his own</p></div>
<div id="found"><b id="found-n">0</b> / <span id="found-total">0</span><br>places found</div>
<div id="toast"></div>
<div id="bubble"></div>

<script>
(function(){
'use strict';
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });

// ---------- params ----------
var Q = new URLSearchParams(location.search);
var DAY_LEN = parseFloat(Q.get('day')) || 420;          // seconds per full day
var T0 = Q.has('t') ? parseFloat(Q.get('t')) : 0.30;    // start time of day (morning)
var START_X = parseFloat(Q.get('x')) || 2260;
var START_Z = parseFloat(Q.get('z')) || 0.58;
var WORLD_W = 4400;

// ---------- canvas ----------
var canvas = document.getElementById('scene');
var g = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1, horizonY = 0, meadowH = 0;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  horizonY = H * 0.46; meadowH = H - horizonY;
}
window.addEventListener('resize', resize);
resize();

// ---------- helpers ----------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function lerp(a,b,k){ return a+(b-a)*k; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function smooth(k){ return k*k*(3-2*k); }
function hex(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function carr(c){ return typeof c === 'string' ? c.match(/[\d.]+/g).map(Number) : c; }
function lerpC(c1,c2,k){ c1=carr(c1); c2=carr(c2); return 'rgb(' + Math.round(lerp(c1[0],c2[0],k)) + ',' + Math.round(lerp(c1[1],c2[1],k)) + ',' + Math.round(lerp(c1[2],c2[2],k)) + ')'; }
function rgba(c,a){ c=carr(c); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

// ---------- palettes (dawn / day / dusk / night) ----------
var PALS = {
  night: { skyTop:'#232a44', skyBot:'#4a4460', ridgeFar:'#3f4761', ridgeMid:'#343c50', trees:'#2c3634', mead1:'#4b5545', mead2:'#3a473c', water:'#31405a', cloud:'#565a74', dark:1.0 },
  dawn:  { skyTop:'#e0a87f', skyBot:'#f7e3c2', ridgeFar:'#c9a48f', ridgeMid:'#ab8878', trees:'#6f7a5e', mead1:'#b8a470', mead2:'#9a885e', water:'#e6c49c', cloud:'#f2d7bd', dark:0.30 },
  day:   { skyTop:'#a5d2de', skyBot:'#f2efe0', ridgeFar:'#bccbb2', ridgeMid:'#97ab8f', trees:'#5f7a52', mead1:'#b3c682', mead2:'#94a968', water:'#a8d0d8', cloud:'#ffffff', dark:0.0 },
  dusk:  { skyTop:'#e08a5f', skyBot:'#f8d09a', ridgeFar:'#c08f7c', ridgeMid:'#9c7266', trees:'#5d5f46', mead1:'#bb9558', mead2:'#967048', water:'#eeb787', cloud:'#f6bf9a', dark:0.38 }
};
Object.keys(PALS).forEach(function(k){ var p=PALS[k]; Object.keys(p).forEach(function(f){ if(f!=='dark') p[f]=hex(p[f]); }); });
// anchors through the day
var ANCHORS = [ [0.00,'night'], [0.20,'night'], [0.26,'dawn'], [0.36,'day'], [0.68,'day'], [0.78,'dusk'], [0.86,'night'], [1.00,'night'] ];
function palAt(t){
  var i;
  for (i=0;i<ANCHORS.length-1;i++) if (t >= ANCHORS[i][0] && t <= ANCHORS[i+1][0]) break;
  var a = PALS[ANCHORS[i][1]], b = PALS[ANCHORS[i+1][1]];
  var k = smooth(clamp((t - ANCHORS[i][0]) / (ANCHORS[i+1][0] - ANCHORS[i][0]), 0, 1));
  var out = {};
  Object.keys(a).forEach(function(f){ out[f] = (f==='dark') ? lerp(a[f],b[f],k) : lerpC(a[f],b[f],k); });
  out.darkRaw = out.dark;
  return out;
}
function sunPos(t){ // t in [0.25,0.75] day arc
  var k = (t - 0.25) / 0.5;
  return { x: W * (0.12 + 0.76 * k), y: horizonY - Math.sin(k * Math.PI) * horizonY * 0.78, up: Math.sin(k * Math.PI) };
}
function moonPos(t){
  var k = (t >= 0.75) ? (t - 0.75) / 0.5 : (t + 0.25) / 0.5;
  return { x: W * (0.15 + 0.7 * k), y: horizonY - Math.sin(k * Math.PI) * horizonY * 0.6, up: Math.sin(k * Math.PI) };
}

// ---------- world features ----------
var PLACES = [
  { id:'field',  name:'the flower field', sub:'smells like summer',    x:560,  z:0.62, r:170, sit:false },
  { id:'oak',    name:'the old oak',      sub:'older than the valley', x:1080, z:0.34, r:110, sit:true  },
  { id:'pond',   name:'the pond',         sub:'still water',           x:1900, z:0.42, r:150, sit:true  },
  { id:'fire',   name:'the campfire',     sub:'warm even unlit',       x:3050, z:0.60, r:110, sit:true  },
  { id:'rock',   name:'the overlook',     sub:'can see everything',    x:3750, z:0.30, r:110, sit:false }
];
PLACES.forEach(function(p){ p.found = false; });

// the pond is water - he walks around it, not through it
var POND = { x: 1900, z: 0.44, rx: 250, rz: 0.115 };
function pondD2(x, z){ var ex = (x - POND.x)/POND.rx, ez = (z - POND.z)/POND.rz; return ex*ex + ez*ez; }

// the creek - outflow from the pond, meanders toward the camera
var CREEK = [ {x:1900,z:0.53}, {x:1975,z:0.62}, {x:1915,z:0.74}, {x:2025,z:0.88}, {x:1985,z:1.06} ];
function creekD(x, z){
  var best = 1e9;
  for (var ci = 0; ci < CREEK.length - 1; ci++){
    var a = CREEK[ci], b = CREEK[ci+1];
    var ax = a.x, ay = a.z*900, bx = b.x, by = b.z*900;
    var dx = bx-ax, dy = by-ay, len2 = dx*dx + dy*dy;
    var tt = ((x-ax)*dx + (z*900-ay)*dy) / len2;
    tt = Math.max(0, Math.min(1, tt));
    var ex2 = ax + dx*tt - x, ey2 = ay + dy*tt - z*900;
    var d2 = ex2*ex2 + ey2*ey2;
    if (d2 < best) best = d2;
  }
  return Math.sqrt(best);
}
document.getElementById('found-total').textContent = PLACES.length;
var found = 0;

// meadow dressing
var rng = mulberry32(7);
var bushes = []; for (var i=0;i<11;i++) bushes.push({ x: 200 + rng()*(WORLD_W-400), z: 0.15 + rng()*0.7, s: 0.7+rng()*0.8, ph: rng()*6.28 });
var stones = []; for (i=0;i<22;i++) stones.push({ x: rng()*WORLD_W, z: 0.2 + rng()*0.75, s: 0.5+rng()*1.1 });
var tufts = []; for (i=0;i<230;i++) tufts.push({ x: rng()*WORLD_W, z: 0.12 + rng()*0.86, ph: rng()*6.28, s: 0.7+rng()*0.7 });
var flowers = [];
for (i=0;i<70;i++) flowers.push({ x: 380 + rng()*420, z: 0.3 + rng()*0.6, ph: rng()*6.28, c: ['#c96f4a','#d9a441','#f2e4c8','#b45f3d'][Math.floor(rng()*4)] });
for (i=0;i<30;i++) flowers.push({ x: rng()*WORLD_W, z: 0.25 + rng()*0.65, ph: rng()*6.28, c: ['#c96f4a','#d9a441','#f2e4c8'][Math.floor(rng()*3)] });
var clouds = []; for (i=0;i<6;i++) clouds.push({ x: rng()*WORLD_W, y: 0.06 + rng()*0.2, s: 0.6+rng()*0.9, v: 6+rng()*8 });
var stars = []; for (i=0;i<90;i++) stars.push({ x: rng(), y: rng()*0.42, r: 0.5+rng()*1.1, tw: rng()*6.28 });
var treesFar = []; for (i=0;i<90;i++) treesFar.push({ x: i/90, h: 0.5+rng()*0.9, w: 0.6+rng()*0.8 });
tufts = tufts.filter(function(o){ return pondD2(o.x, o.z) > 1.4; });
flowers = flowers.filter(function(o){ return pondD2(o.x, o.z) > 1.4; });
bushes = bushes.filter(function(o){ return pondD2(o.x, o.z) > 1.6; });
stones = stones.filter(function(o){ return pondD2(o.x, o.z) > 1.5; });
tufts = tufts.filter(function(o){ return creekD(o.x, o.z) > 26; });
flowers = flowers.filter(function(o){ return creekD(o.x, o.z) > 24; });
stones = stones.filter(function(o){ return creekD(o.x, o.z) > 24; });
bushes = bushes.filter(function(o){ return creekD(o.x, o.z) > 42; });

// creatures
var birds = { t: 8 + Math.random()*10, flock: null };
var deer = { active:false, t: 40 + Math.random()*40, x:0, dir:1, state:'stand', timer:0 };
var fireflies = []; for (i=0;i<14;i++) fireflies.push({ x: rng()*WORLD_W, z: 0.2+rng()*0.6, ph: rng()*6.28, vx:0, vy:0 });
var shoot = { active:false, t: 20 + Math.random()*40, x:0, y:0, vx:0, life:0 };
var ripples = []; var rippleT = 2;
var butterflies = [];
for (i=0;i<2;i++) butterflies.push({ x: 500+i*120, z: 0.5, ph: rng()*6.28, tx: 500, tz: 0.5 });
var fireParts = [];
var rain = { active: false, t: 75 + Math.random()*90, a: 0 };
if (/[?&]rain=1/.test(location.search)){ rain.active = true; rain.a = 0.85; rain.t = 300; }
var owl = { active: false, t: 25 + Math.random()*40, x: 0, y: 0, dir: 1, ph: 0 };
if (/[?&]owl=1/.test(location.search)){ owl.active = true; owl.x = 420; owl.y = 130; owl.dir = 1; owl.t = 300; }
var ducks = [];
for (i=0;i<2;i++) ducks.push({ a: rng()*6.28, r: 55 + rng()*90, sp: (0.10 + rng()*0.08) * (rng()<0.5?1:-1), flap: rng()*6.28 });

// ---------- the little man ----------
var man = {
  x: START_X, z: START_Z, vx: 0, vz: 0,
  face: 1, visFace: 1, lastFace: 1, turnT: 0, squash: 1, step: 0,
  state: 'stroll',            // stroll | pause | sit
  hop: 0,
  tx: START_X, tz: START_Z, speed: 66,
  pauseUntil: 0, sitUntil: 0,
  heading: 0
};
if (pondD2(man.x, man.z) < 1.15) man.z = POND.z + POND.rz * 2.4;  // never stand in the water
var camX = clamp(man.x - W*0.5, 0, WORLD_W - W);

function pickTarget(){
  var un = PLACES.filter(function(p){ return !p.found; });
  if (un.length && Math.random() < 0.42){
    var p = un[Math.floor(Math.random()*un.length)];
    return { x: p.x + (Math.random()-0.5)*30, z: clamp(p.z + 0.06 + Math.random()*0.1, 0.18, 0.9), place: p };
  }
  for (var i=0;i<14;i++){
    var t = { x: 120 + Math.random()*(WORLD_W-240), z: 0.2 + Math.random()*0.68 };
    var d = Math.abs(t.x - man.x);
    if (d > 350 && d < 1400 && pondD2(t.x, t.z) > 1.7) return t;
  }
  var fx = clamp(man.x + (Math.random()<0.5?-1:1)*500, 120, WORLD_W-120);
  var fz = 0.3+Math.random()*0.5;
  if (pondD2(fx, fz) < 1.7) fz = POND.z + POND.rz * 2.2;
  return { x: fx, z: fz };
}

function newLeg(){
  man.state = 'stroll';
  var hurry = Math.random() < 0.12;
  var t = pickTarget();
  if (hurry){ man.speed = 195; man.tx = clamp(man.x + (Math.random()<0.5?-1:1)*(250+Math.random()*200), 120, WORLD_W-120); man.tz = clamp(man.z + (Math.random()-0.5)*0.2, 0.2, 0.88); }
  else { man.speed = 58 + Math.random()*26; man.tx = t.x; man.tz = t.z; man.place = t.place || null; }
}

// thoughts
var THOUGHTS = {
  day:   ['nice light.','warm out.','good sky today.','breeze feels right.','green everywhere.'],
  dusk:  ['gold hour.','sky is showing off.','best part of the day.'],
  night: ['stars out.','quiet.','fireflies.','getting late.']
};
function thoughtPool(t){
  if (t > 0.76 && t < 0.88) return THOUGHTS.dusk;
  if (t > 0.86 || t < 0.22) return THOUGHTS.night;
  return THOUGHTS.day;
}

// ---------- DOM bits ----------
var toast = document.getElementById('toast'), toastTimer = null;
function showToast(p){
  toast.innerHTML = p.name + '<span>' + p.sub + '</span>';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 3400);
}
var bubble = document.getElementById('bubble'), bubbleTimer = null;
function say(text, ms){
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(function(){ bubble.classList.remove('show'); }, ms);
}

// ---------- projection ----------
function gy(z){ return horizonY + z * meadowH * 0.92; }
function zs(z){ return 0.42 + z * 0.85; }

// ---------- drawing ----------
function ridge(parallax, baseY, amp, seed, color){
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(-4, H);
  for (var sx = -4; sx <= W+24; sx += 24){
    var wx = (sx + camX * parallax) * 0.0035 + seed;
    var n = Math.sin(wx*1.7+seed)*0.55 + Math.sin(wx*3.9+seed*2)*0.3 + Math.sin(wx*8.3+seed*3)*0.15;
    g.lineTo(sx, baseY - (n*0.5+0.5)*amp);
  }
  g.lineTo(W+24, H);
  g.closePath();
  g.fill();
}

function drawTree(gx, gy2, s, color, sway){
  // trunk
  g.strokeStyle = 'rgba(74,56,42,0.9)';
  g.lineWidth = 5*s; g.lineCap = 'round';
  g.beginPath(); g.moveTo(gx, gy2); g.quadraticCurveTo(gx + sway*2*s, gy2 - 26*s, gx + sway*4*s, gy2 - 44*s); g.stroke();
  // canopy blobs
  g.fillStyle = color;
  var cx = gx + sway*4*s, cy = gy2 - 44*s;
  [[0,0,27],[-23,10,18],[23,9,19],[-10,-16,18],[13,-14,16],[-30,2,13],[30,1,14]].forEach(function(b){
    g.beginPath(); g.arc(cx + b[0]*s, cy + b[1]*s, b[2]*s, 0, 6.29); g.fill();
  });
}

function drawMan(x, y, s, face, step, mode, running, squash){
  squash = squash || 1;
  g.save();
  g.translate(x, y);
  // shadow
  g.fillStyle = 'rgba(40,32,24,0.20)';
  g.beginPath(); g.ellipse(0, 0, 13*s, 4*s, 0, 0, 6.29); g.fill();
  var bob = (mode==='walk') ? -Math.abs(Math.sin(step))*2.2*s : (mode==='idle' ? -Math.sin(step*0.4)*0.8*s : 0);
  var sit = (mode==='sit');
  g.translate(0, bob + (sit ? 8*s : 0));
  g.scale(face*s*(2-squash), s*squash);
  var swing = (mode==='walk') ? Math.sin(step)*(running?0.62:0.42) : 0;
  // legs
  g.lineCap = 'round';
  g.lineWidth = 4.6;
  if (sit){
    g.strokeStyle = '#5b4a3d';
    g.beginPath(); g.moveTo(-3, -16); g.lineTo(8, -14); g.lineTo(10, -4); g.stroke();
    g.strokeStyle = '#4e3f34';
    g.beginPath(); g.moveTo(-1, -15); g.lineTo(11, -13); g.lineTo(13, -3); g.stroke();
  } else {
    g.strokeStyle = '#5b4a3d';
    g.beginPath(); g.moveTo(-1, -26); g.lineTo(Math.sin(swing)*10, -26 + 24 - Math.abs(Math.cos(swing))*2); g.stroke();
    g.strokeStyle = '#4e3f34';
    g.beginPath(); g.moveTo(1, -26); g.lineTo(Math.sin(-swing)*10, -26 + 24 - Math.abs(Math.cos(swing))*2); g.stroke();
  }
  // body
  g.fillStyle = '#c96f4a';
  roundRect(-9.5, -46, 19, 22, 8); g.fill();
  // arms
  g.lineWidth = 4.2; g.strokeStyle = '#b45f3d';
  if (!sit){
    g.beginPath(); g.moveTo(-7, -42); g.lineTo(-7 + Math.sin(-swing)*8*0.8, -42 + 11); g.stroke();
    g.beginPath(); g.moveTo(7, -42); g.lineTo(7 + Math.sin(swing)*8*0.8, -42 + 11); g.stroke();
  } else {
    g.beginPath(); g.moveTo(-7, -40); g.lineTo(-4, -32); g.stroke();
    g.beginPath(); g.moveTo(7, -40); g.lineTo(10, -32); g.stroke();
  }
  // head
  g.fillStyle = '#8a5a3b';
  g.beginPath(); g.arc(2, -55, 9.5, 0, 6.29); g.fill();
  // hair
  g.fillStyle = '#2e2119';
  g.beginPath(); g.arc(2, -56.5, 9.5, Math.PI*1.02, Math.PI*1.98); g.fill();
  // gold band
  g.fillStyle = '#d9a441';
  roundRect(-6.9, -62.5, 16.8, 3, 1.5); g.fill();

}
function roundRect(x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

function drawDeer(x, y, s, flip, color){
  g.save(); g.translate(x, y); g.scale(flip*s, s);
  g.fillStyle = color;
  g.beginPath(); g.ellipse(0, -14, 15, 8, 0, 0, 6.29); g.fill();          // body
  g.beginPath(); g.ellipse(13, -22, 4.5, 7, -0.4, 0, 6.29); g.fill();     // neck
  g.beginPath(); g.ellipse(18, -27, 5, 3.6, 0.15, 0, 6.29); g.fill();     // head
  g.strokeStyle = color; g.lineWidth = 2.2; g.lineCap = 'round';
  [[-9,-8],[-4,-7],[5,-7],[10,-8]].forEach(function(l){
    g.beginPath(); g.moveTo(l[0], l[1]); g.lineTo(l[0]+1, 0); g.stroke();
  });
  g.lineWidth = 1.4;                                                       // antlers
  g.beginPath(); g.moveTo(19,-30); g.lineTo(22,-36); g.moveTo(20,-31); g.lineTo(24,-34);
  g.moveTo(16,-30); g.lineTo(15,-36); g.stroke();
  g.restore();
}

// ---------- main loop ----------
var time = 0, last = performance.now();

function frame(now){
  var dt = Math.min((now - last)/1000, 0.05);
  last = now;
  time += dt;
  var t = ((T0 + time / DAY_LEN) % 1 + 1) % 1;
  var pal = palAt(t);
  var dark = pal.darkRaw;
  var wind = Math.sin(time * 0.23) * 0.5 + 0.5;

  // ---- man AI ----
  var spd = Math.hypot(man.vx, man.vz);
  if (man.state === 'pause' || man.state === 'sit'){
    if (now >= man.pauseUntil) newLeg();
  } else {
    var dx = man.tx - man.x, dz = man.tz - man.z;
    var dist = Math.hypot(dx, dz * 900); // z compressed space
    if (dist < 26){
      var pool = thoughtPool(t);
      var p = man.place;
      if (p && p.sit && Math.random() < 0.5){
        man.state = 'sit';
        man.pauseUntil = now + 7000 + Math.random()*7000;
        man.x = p.x + 52; man.z = p.z + 0.10;   // settle beside it, not on top of it
        man.face = -1; man.lastFace = -1; man.visFace = -1;      // turn to look at it
        say(p.id === 'fire' ? 'warm.' : p.sub + '.', 3200);
      } else {
        man.state = 'pause';
        man.pauseUntil = now + 2400 + Math.random()*4200;
        if (Math.random() < 0.5){
          say(p && Math.random() < 0.4 ? p.sub + '.' : pool[Math.floor(Math.random()*pool.length)], 3000);
        }
      }
      man.place = null;
    } else {
      var desired = Math.atan2(dx, dz*900);
      // curve around the pond instead of wading through it
      var pd = pondD2(man.x + man.vx*0.6, man.z + man.vz*0.6*4);
      if (pd < 2.1){
        var ex = (man.x - POND.x)/POND.rx, ez = (man.z - POND.z)/POND.rz;
        var tAng = Math.atan2(-ez, ex);              // tangent around the ellipse
        var tAng2 = tAng + Math.PI;                  // other direction
        var d1 = Math.abs(((desired - tAng + Math.PI*3) % (2*Math.PI)) - Math.PI);
        var d2 = Math.abs(((desired - tAng2 + Math.PI*3) % (2*Math.PI)) - Math.PI);
        var best = d1 < d2 ? tAng : tAng2;
        var w = clamp((2.1 - pd) / 1.1, 0, 1);       // stronger the closer he gets
        var dd = ((best - desired + Math.PI*3) % (2*Math.PI)) - Math.PI;
        desired += dd * w;
      }
      var dh = desired - man.heading;
      while (dh > Math.PI) dh -= 2*Math.PI; while (dh < -Math.PI) dh += 2*Math.PI;
      var maxTurn = 1.9 * dt;
      man.heading += clamp(dh, -maxTurn, maxTurn);
      var approach = clamp(dist / 140, 0.3, 1);  // ease into stops
      var target = man.speed * approach * Math.max(0.4, Math.cos(dh));
      var k = 1 - Math.exp(-dt / 0.35);
      man.vx += (Math.sin(man.heading)*target - man.vx) * k;
      man.vz += (Math.cos(man.heading)*target/900 - man.vz) * k;
      man.x = clamp(man.x + man.vx * dt, 90, WORLD_W - 90);
      man.z = clamp(man.z + man.vz * dt, 0.16, 0.9);
      // never actually in the water
      var pd2v = pondD2(man.x, man.z);
      if (pd2v < 1.0){
        var k2 = 1 / Math.sqrt(pd2v);
        man.x = POND.x + (man.x - POND.x) * k2;
        man.z = POND.z + (man.z - POND.z) * k2;
      }
      man.step += spd * dt * (man.speed > 120 ? 0.052 : 0.075);
      if (Math.abs(man.vx) > 4) man.face = man.vx > 0 ? 1 : -1;
      // discoveries
      PLACES.forEach(function(p){
        if (!p.found && Math.abs(man.x - p.x) < p.r && Math.abs(man.z - p.z) < 0.22){
          p.found = true; found++;
          document.getElementById('found-n').textContent = found;
          showToast(p);
          man.hop = 1;          // little jump of joy
          man.state = 'pause';
          man.pauseUntil = now + 5000;
          man.tx = man.x; man.tz = man.z;
          man.vx = 0; man.vz = 0;
        }
      });
    }
  }
  if (man.state !== 'stroll'){ man.vx *= Math.exp(-dt*4); man.vz *= Math.exp(-dt*4); }
  if (man.hop > 0) man.hop = Math.max(0, man.hop - dt*2.4);
    if (man.face !== man.lastFace){ man.turnT = 0.15; man.lastFace = man.face; man.visFace = man.face; }
  var squash = 1;
  if (man.turnT > 0){ man.turnT -= dt; squash = 1 - 0.16*Math.sin(Math.PI*Math.max(0, man.turnT)/0.15); }
  man.squash = squash;
  var mode = man.state === 'sit' ? 'sit' : (spd > 6 ? 'walk' : 'idle');
  if (mode === 'idle') man.step += dt * 2;

  // camera
  var camTarget = clamp(man.x - W*0.5, 0, Math.max(0, WORLD_W - W));
  camX += (camTarget - camX) * (1 - Math.exp(-dt*2.4));

  // ---- creatures ----
  // birds
  birds.t -= dt;
  if (birds.t <= 0 && dark < 0.6){
    birds.t = 16 + Math.random()*22;
    var dir = Math.random() < 0.5 ? 1 : -1;
    birds.flock = { x: dir > 0 ? camX - 300 : camX + W + 300, y: 40 + Math.random()*horizonY*0.5, dir: dir, n: 3 + Math.floor(Math.random()*3), ph: 0 };
  }
  if (birds.flock){
    birds.flock.x += birds.flock.dir * 55 * dt;
    birds.flock.ph += dt * 7;
    if (birds.flock.x < camX - 500 || birds.flock.x > camX + W + 500) birds.flock = null;
  }
  // deer
  if (!deer.active){
    deer.t -= dt;
    if (deer.t <= 0){
      deer.active = true; deer.state = 'stand'; deer.timer = 5 + Math.random()*5;
      deer.x = camX + W * (0.2 + Math.random()*0.6);
      deer.dir = Math.random() < 0.5 ? 1 : -1;
    }
  } else {
    deer.timer -= dt;
    if (deer.state === 'stand' && deer.timer <= 0){ deer.state = 'walk'; deer.timer = 6 + Math.random()*6; }
    else if (deer.state === 'walk'){
      deer.x += deer.dir * 22 * dt;
      if (deer.timer <= 0){ deer.active = false; deer.t = 90 + Math.random()*150; }
    }
  }
  // shooting star
  if (!shoot.active && dark > 0.8){
    shoot.t -= dt;
    if (shoot.t <= 0){ shoot.active = true; shoot.x = Math.random()*W*0.8; shoot.y = 20 + Math.random()*60; shoot.vx = 320 + Math.random()*160; shoot.life = 0.8; }
  }
  if (shoot.active){ shoot.x += shoot.vx*dt; shoot.y += shoot.vx*0.35*dt; shoot.life -= dt; if (shoot.life <= 0){ shoot.active = false; shoot.t = 25 + Math.random()*50; } }
  // rain - passes through on slow timescales
  rain.t -= dt;
  if (rain.t <= 0){
    rain.active = !rain.active;
    rain.t = rain.active ? 40 + Math.random()*70 : 150 + Math.random()*200;
    if (rain.active && dark < 0.5 && man.state !== 'stroll') say('rain.', 2400);
  }
  rain.a += ((rain.active ? 1 : 0) - rain.a) * (1 - Math.exp(-dt*0.4));
  // owl - rare silent glide, only deep night
  if (!owl.active && dark > 0.75){
    owl.t -= dt;
    if (owl.t <= 0){
      owl.active = true; owl.dir = Math.random() < 0.5 ? 1 : -1;
      owl.x = owl.dir > 0 ? -90 : W + 90; owl.y = 60 + Math.random()*horizonY*0.5; owl.ph = 0;
    }
  }
  if (owl.active){
    owl.x += owl.dir * 34 * dt; owl.ph += dt * 3.2;
    if (owl.x < -140 || owl.x > W + 140){ owl.active = false; owl.t = 70 + Math.random()*90; }
  }
  // pond ripples
  rippleT -= dt;
  if (rippleT <= 0){ rippleT = rain.a > 0.4 ? 0.18 + Math.random()*0.3 : 2.5 + Math.random()*4; ripples.push({ r: 4, a: 0.5, x: (Math.random()-0.5)*140, y: (Math.random()-0.5)*22 }); }
  ripples.forEach(function(r){ r.r += 26*dt; r.a -= 0.16*dt; });
  ripples = ripples.filter(function(r){ return r.a > 0; });
  // fireflies drift
  fireflies.forEach(function(f){
    f.ph += dt;
    f.x += Math.sin(f.ph*0.7)*14*dt; f.z = clamp(f.z + Math.cos(f.ph*0.5)*0.03*dt, 0.15, 0.9);
  });
  // butterflies (day, near flowers or man)
  butterflies.forEach(function(b, bi){
    b.ph += dt*3;
    if (Math.random() < 0.008){ b.tx = clamp(b.x + (Math.random()-0.5)*400, 100, WORLD_W-100); b.tz = 0.3+Math.random()*0.5; }
    b.x += clamp(b.tx - b.x, -30, 30) * dt * 1.6;
    b.z += clamp(b.tz - b.z, -0.1, 0.1) * dt * 1.6;
  });
  // ducks paddle slow circles on the pond
  ducks.forEach(function(dk){
    dk.a += dk.sp * dt;
    dk.flap += dt * 3;
    if (Math.random() < dt * 0.25){
      ripples.push({ r: 3, a: 0.35, x: Math.cos(dk.a)*dk.r, y: Math.sin(dk.a)*dk.r*0.24 + 6 });
    }
  });
  // campfire particles
  var fireLit = dark > 0.28 || (man.state==='sit' && Math.abs(man.x-3050)<130);
  if (fireLit && Math.random() < 0.5) fireParts.push({ x:(Math.random()-0.5)*10, y:0, vy:-(18+Math.random()*22), life:0.6+Math.random()*0.7, s:2+Math.random()*2.5 });
  fireParts.forEach(function(p){ p.y += p.vy*dt; p.x += Math.sin(time*6+p.y*0.2)*8*dt; p.life -= dt; });
  fireParts = fireParts.filter(function(p){ return p.life > 0; });

  // ================= draw =================
  // sky
  var sky = g.createLinearGradient(0, 0, 0, horizonY*1.15);
  sky.addColorStop(0, pal.skyTop); sky.addColorStop(1, pal.skyBot);
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // stars
  if (dark > 0.25){
    stars.forEach(function(s){
      var a = dark * (0.35 + 0.65*Math.abs(Math.sin(time*0.8 + s.tw)));
      g.fillStyle = 'rgba(245,238,214,' + (a*0.85).toFixed(3) + ')';
      g.beginPath(); g.arc(s.x*W, s.y*H, s.r, 0, 6.29); g.fill();
    });
  }
  // shooting star
  if (shoot.active){
    g.strokeStyle = 'rgba(250,240,210,' + clamp(shoot.life,0,1)*0.9 + ')';
    g.lineWidth = 1.6; g.lineCap = 'round';
    g.beginPath(); g.moveTo(shoot.x, shoot.y); g.lineTo(shoot.x - 60, shoot.y - 21); g.stroke();
  }
  // sun
  if (t > 0.24 && t < 0.76){
    var sp = sunPos(t);
    var sg = g.createRadialGradient(sp.x, sp.y, 2, sp.x, sp.y, 90);
    sg.addColorStop(0, 'rgba(255,224,160,0.9)'); sg.addColorStop(1, 'rgba(255,224,160,0)');
    g.fillStyle = sg; g.beginPath(); g.arc(sp.x, sp.y, 90, 0, 6.29); g.fill();
    g.fillStyle = '#ffe6b0'; g.beginPath(); g.arc(sp.x, sp.y, 20, 0, 6.29); g.fill();
  }
  // moon
  if (dark > 0.5){
    var mp = moonPos(t);
    if (mp.up > 0.05){
      var mg = g.createRadialGradient(mp.x, mp.y, 2, mp.x, mp.y, 60);
      mg.addColorStop(0, 'rgba(245,233,200,0.55)'); mg.addColorStop(1, 'rgba(245,233,200,0)');
      g.fillStyle = mg; g.beginPath(); g.arc(mp.x, mp.y, 60, 0, 6.29); g.fill();
      g.fillStyle = '#f5e9c8'; g.beginPath(); g.arc(mp.x, mp.y, 14, 0, 6.29); g.fill();
      g.fillStyle = rgba(pal.skyTop, 0.35); g.beginPath(); g.arc(mp.x-5, mp.y-3, 11, 0, 6.29); g.fill();
    }
  }
  // clouds
  clouds.forEach(function(c){
    c.x += c.v * dt * (0.4 + wind*0.6);
    if (c.x - camX*0.2 > W + 260) c.x -= WORLD_W;
    var cx = c.x - camX*0.2, cy = c.y * H;
    if (cx < -280) return;
    var s = c.s * 30;
    var puffs = [[0,0,1.5,0.5],[-0.95,0.14,0.85,0.36],[0.95,0.12,0.95,0.38],[-0.42,-0.3,0.78,0.34],[0.48,-0.27,0.72,0.32]];
    for (var pi = 0; pi < puffs.length; pi++){
      var pf = puffs[pi];
      g.fillStyle = rgba(pal.cloud, 0.38 + 0.1 * ((pi + c.s * 7) % 3));
      g.beginPath();
      g.ellipse(cx + pf[0]*s, cy + pf[1]*s, pf[2]*s, pf[3]*s, 0, 0, 6.29);
      g.fill();
    }
  });
  // ridges
  ridge(0.10, horizonY - 6, H*0.30, 3.1, lerpC(pal.ridgeFar, pal.skyBot, 0.45));
  ridge(0.26, horizonY + 2, H*0.16, 7.7, lerpC(pal.ridgeMid, pal.skyBot, 0.18));
  // treeline
  var tl = horizonY + 6;
  for (var ti = 0; ti < treesFar.length; ti++){
    var tr = treesFar[ti];
    var tx = tr.x * (WORLD_W*0.55 + W) - camX * 0.55;
    if (tx < -40 || tx > W + 40) continue;
    g.fillStyle = (ti % 3 === 0) ? lerpC(pal.trees, pal.ridgeMid, 0.35) : (ti % 3 === 1 ? pal.trees : lerpC(pal.trees, pal.mead1, 0.22));
    if (tr.h > 1.28 && tr.w < 0.95){
      g.beginPath();
      g.ellipse(tx, tl - tr.h*13, 5.5*tr.w, 16*tr.h*0.9, 0, 0, 6.29);
      g.fill();
    } else if (tr.h > 1.15){
      g.beginPath();
      g.moveTo(tx, tl - tr.h*26); g.lineTo(tx - 9*tr.w, tl); g.lineTo(tx + 9*tr.w, tl);
      g.closePath(); g.fill();
    } else {
      g.beginPath();
      g.ellipse(tx, tl - tr.h*11, 13*tr.w, 15*tr.h, 0, 0, 6.29);
      g.fill();
    }
  }
  // deer in treeline
  if (deer.active){
    var dxs = deer.x - camX * 0.72;
    drawDeer(dxs, tl + 4, 0.85, deer.dir, rgba(pal.trees, 1));
  }
  // meadow base
  var mg2 = g.createLinearGradient(0, horizonY, 0, H);
  mg2.addColorStop(0, pal.mead1); mg2.addColorStop(1, pal.mead2);
  g.fillStyle = mg2; g.fillRect(0, tl - 4, W, H - tl + 4);
  // path
  g.strokeStyle = 'rgba(242,228,200,0.16)';
  g.lineWidth = meadowH * 0.10; g.lineCap = 'round';
  g.beginPath();
  for (var px = -40; px <= W + 40; px += 60){
    var wxp = px + camX;
    var py = gy(0.58) + Math.sin(wxp * 0.0016) * meadowH * 0.05;
    if (px === -40) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.stroke();

  // creek - ribbon from the pond toward the camera, flowing glints
  (function(){

    g.beginPath();
    for (var ci = 0; ci < pts.length; ci++){
      var p = pts[ci], hw = 7 + p.z * 16;
      if (ci === 0) g.moveTo(p.x - hw, p.y); else g.lineTo(p.x - hw, p.y);
    }
    for (ci = pts.length - 1; ci >= 0; ci--){
      p = pts[ci]; hw = 7 + p.z * 16;
      g.lineTo(p.x + hw, p.y);
    }
    g.closePath();
    g.fillStyle = lerpC(pal.water, pal.ridgeMid, 0.22);
    g.fill();
    // banks
    g.strokeStyle = rgba(pal.mead2, 0.5); g.lineWidth = 2.5;
    g.beginPath();
    for (ci = 0; ci < pts.length; ci++){ p = pts[ci]; hw = 7 + p.z * 16; if (ci === 0) g.moveTo(p.x - hw, p.y); else g.lineTo(p.x - hw, p.y); }
    g.stroke();
    g.beginPath();
    for (ci = 0; ci < pts.length; ci++){ p = pts[ci]; hw = 7 + p.z * 16; if (ci === 0) g.moveTo(p.x + hw, p.y); else g.lineTo(p.x + hw, p.y); }
    g.stroke();
    // flow glints sliding downstream
    g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = 1.4; g.lineCap = 'round';
    var segLen = [], tot = 0;
    for (ci = 0; ci < pts.length - 1; ci++){ var l = Math.hypot(pts[ci+1].x - pts[ci].x, pts[ci+1].y - pts[ci].y); segLen.push(l); tot += l; }
    for (var gi = 0; gi < 4; gi++){

  // ---- sorted meadow objects ----

  drawList.push({ z: 0.575, f: function(){ // plank bridge over the creek

  [[480, 0.20, 0.9], [3350, 0.24, 1.05], [2980, 0.17, 0.75]].forEach(function(mt){
    drawList.push({ z: mt[1], f: function(){
      var x = mt[0] - camX, y = gy(mt[1]), s = zs(mt[1]) * mt[2] * 1.6;
      if (x < -140 || x > W + 140) return;
      drawTree(x, y, s, rgba(pal.trees, 1), Math.sin(time*0.8 + mt[0]) * wind * 1.2);
    }});
  });
  drawList.push({ z: 0.42, f: function(){ // pond
    var x = 1900 - camX, y = gy(0.44), s = zs(0.44);
    if (x < -400 || x > W + 400) return;
    var wg = g.createRadialGradient(x, y, 10*s, x, y, 210*s);
    wg.addColorStop(0, pal.water);
    wg.addColorStop(1, lerpC(pal.water, pal.ridgeMid, 0.35));
    g.fillStyle = wg;
    g.beginPath(); g.ellipse(x, y, 210*s, 52*s, 0, 0, 6.29); g.fill();
    g.strokeStyle = rgba(pal.mead2, 0.55); g.lineWidth = 5*s;
    g.beginPath(); g.ellipse(x, y, 210*s, 52*s, 0, 0, 6.29); g.stroke();
    // sun/moon glint
    g.fillStyle = 'rgba(255,240,200,' + (dark > 0.5 ? 0.10 : 0.16) + ')';
    g.beginPath(); g.ellipse(x - 20*s, y - 8*s, 90*s, 14*s, 0, 0, 6.29); g.fill();
    // shimmer
    g.strokeStyle = 'rgba(255,255,255,0.14)'; g.lineWidth = 1.4;
    for (var si = 0; si < 4; si++){
      var shy = y - 20*s + si*12*s;
      var shx = x + Math.sin(time*0.9 + si*1.7)*30*s;
      g.beginPath(); g.moveTo(shx - 34*s, shy); g.lineTo(shx + 34*s, shy); g.stroke();
    }
    // ripples
    ripples.forEach(function(r){
      g.strokeStyle = 'rgba(255,255,255,' + r.a.toFixed(3) + ')';
      g.lineWidth = 1.3;
      g.beginPath(); g.ellipse(x + r.x*s, y + r.y*s, r.r*s, r.r*0.32*s, 0, 0, 6.29); g.stroke();
    });
    // lily pads
    g.fillStyle = rgba(pal.trees, 0.85);
    g.beginPath(); g.ellipse(x - 110*s, y + 12*s, 12*s, 5*s, 0, 0, 6.29); g.fill();
    g.beginPath(); g.ellipse(x + 130*s, y - 6*s, 10*s, 4.5*s, 0, 0, 6.29); g.fill();
    // ducks
    ducks.forEach(function(dk){
      var dx2 = x + Math.cos(dk.a)*dk.r*s;
      var dy2 = y + Math.sin(dk.a)*dk.r*0.24*s + 6*s;
      var ddir = dk.sp > 0 ? -1 : 1; // face along travel
      var bob2 = Math.sin(dk.flap) * 0.8 * s;
      g.fillStyle = '#f2e4c8';
      g.beginPath(); g.ellipse(dx2, dy2 + bob2, 8*s, 4.5*s, 0, 0, 6.29); g.fill();
      g.fillStyle = '#7d8b6f';
      g.beginPath(); g.arc(dx2 + ddir*7*s, dy2 - 4*s + bob2, 3.2*s, 0, 6.29); g.fill();
      g.fillStyle = '#d9a441';
      g.beginPath(); g.ellipse(dx2 + ddir*10.5*s, dy2 - 3.5*s + bob2, 1.8*s, 1.1*s, 0, 0, 6.29); g.fill();
    });
  }});
  drawList.push({ z: 0.60, f: function(){ // campfire
    var x = 3050 - camX, y = gy(0.60), s = zs(0.60);
    if (x < -200 || x > W + 200) return;
    // stone ring
    g.fillStyle = rgba(pal.ridgeMid, 1);
    for (var ci = 0; ci < 8; ci++){
      var a = ci/8 * 6.28;
      g.beginPath(); g.ellipse(x + Math.cos(a)*30*s, y + Math.sin(a)*11*s, 9*s, 6.5*s, 0, 0, 6.29); g.fill();
    }
    // logs
    g.strokeStyle = '#5b4a3d'; g.lineWidth = 5*s; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - 12*s, y + 2*s); g.lineTo(x + 12*s, y - 4*s); g.stroke();
    g.beginPath(); g.moveTo(x + 12*s, y + 2*s); g.lineTo(x - 12*s, y - 4*s); g.stroke();
    if (fireLit){
      // glow
      var fg = g.createRadialGradient(x, y - 12*s, 2, x, y - 12*s, 100*s);
      fg.addColorStop(0, 'rgba(255,170,80,' + (0.3 + dark*0.35) + ')'); fg.addColorStop(1, 'rgba(255,170,80,0)');
      g.fillStyle = fg; g.beginPath(); g.arc(x, y - 12*s, 100*s, 0, 6.29); g.fill();
      // flame
      var fl = Math.sin(time*11)*1.6;
      g.fillStyle = '#f2a54a';
      g.beginPath(); g.ellipse(x + fl*0.4, y - 17*s, 8.5*s, 15*s, 0, 0, 6.29); g.fill();
      g.fillStyle = '#f7cf7a';
      g.beginPath(); g.ellipse(x + fl*0.3, y - 12*s, 4.8*s, 8.5*s, 0, 0, 6.29); g.fill();
      g.fillStyle = '#fdf0c0';
      g.beginPath(); g.ellipse(x, y - 8*s, 2.4*s, 4*s, 0, 0, 6.29); g.fill();
      // particles
      fireParts.forEach(function(p){
        g.fillStyle = 'rgba(247,200,110,' + clamp(p.life,0,0.7).toFixed(3) + ')';
        g.beginPath(); g.arc(x + p.x*s, y - 10*s + p.y*s, p.s*s*0.6, 0, 6.29); g.fill();
      });
    }
  }});
  // flowers + tufts + man + butterflies into the sort
  flowers.forEach(function(f){
    drawList.push({ z: f.z, f: function(){
      var x = f.x - camX; if (x < -20 || x > W + 20) return;
      var y = gy(f.z), s = zs(f.z);
      var sw = Math.sin(time*1.4 + f.ph) * (1 + wind*2);
      g.strokeStyle = rgba(pal.trees, 0.9); g.lineWidth = 1.3*s;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + sw*s*0.5, y - 5*s, x + sw*s, y - 9*s); g.stroke();
      g.fillStyle = f.c;
      g.beginPath(); g.arc(x + sw*s, y - 10*s, 2.4*s, 0, 6.29); g.fill();
    }});
  });
  bushes.forEach(function(b2){
    drawList.push({ z: b2.z, f: function(){
      var x = b2.x - camX; if (x < -60 || x > W + 60) return;
      var y = gy(b2.z), s = zs(b2.z) * b2.s;
      var sw = Math.sin(time*0.9 + b2.ph) * wind * 1.2;
      g.fillStyle = rgba(pal.trees, 0.92);
      [[0,0,14],[-11,3,9],[11,3,10],[-4,-7,9],[7,-6,8]].forEach(function(c){
        g.beginPath(); g.arc(x + (c[0]+sw)*s, y - (10+c[1])*s + 10*s, c[2]*s, 0, 6.29); g.fill();
      });
    }});
  });
  stones.forEach(function(st){
    drawList.push({ z: st.z, f: function(){
      var x = st.x - camX; if (x < -20 || x > W + 20) return;
      var y = gy(st.z), s = zs(st.z) * st.s;
      g.fillStyle = rgba(pal.ridgeMid, 0.8);
      g.beginPath(); g.ellipse(x, y - 3*s, 7*s, 4.5*s, 0, Math.PI, 0); g.fill();
    }});
  });
  tufts.forEach(function(t2){
    drawList.push({ z: t2.z, f: function(){
      var x = t2.x - camX; if (x < -20 || x > W + 20) return;
      var y = gy(t2.z), s = zs(t2.z) * t2.s;
      var sw = Math.sin(time*1.2 + t2.ph + t2.x*0.01) * (1.5 + wind*2.5);
      g.strokeStyle = rgba(pal.trees, 0.55); g.lineWidth = 1.6*s; g.lineCap = 'round';
      for (var bi = -1; bi <= 1; bi++){
        g.beginPath(); g.moveTo(x + bi*3*s, y);
        g.quadraticCurveTo(x + bi*3*s + sw*s*0.5, y - 7*s, x + bi*4*s + sw*s, y - 13*s);
        g.stroke();
      }
    }});
  });
  butterflies.forEach(function(b){
    if (dark > 0.4) return;
    drawList.push({ z: b.z + 0.01, f: function(){
      var x = b.x - camX; if (x < -20 || x > W + 20) return;
      var y = gy(b.z) - (26 + Math.sin(b.ph)*10) * zs(b.z);
      var s = zs(b.z) * 0.9, w = Math.abs(Math.sin(b.ph*4)) * 3 + 1;
      g.fillStyle = 'rgba(217,164,65,0.95)';
      g.beginPath(); g.ellipse(x - w*s, y, 3*s, 4.4*s, -0.5, 0, 6.29); g.fill();
      g.beginPath(); g.ellipse(x + w*s, y, 3*s, 4.4*s, 0.5, 0, 6.29); g.fill();
    }});
  });
  // the man
  drawList.push({ z: man.z, f: function(){
    var x = man.x - camX, y = gy(man.z) - Math.sin(man.hop*Math.PI)*16*zs(man.z), s = zs(man.z) * 1.3;
    drawMan(x, y, s, man.visFace, man.step, mode, man.speed > 120, man.squash);
    // fireflies cluster slightly around him at night? no - keep them independent
  }});
  drawList.sort(function(a,b){ return a.z - b.z; });
  drawList.forEach(function(d){ d.f(); });

  // foreground blades - big soft framing at the bottom edge
  g.lineCap = 'round';
  for (var fb = 0; fb < 7; fb++){
    var fx2 = ((fb * 977 + 313) % 1000) / 1000 * (W + 160) - 80;
    var fh = 60 + ((fb * 421) % 60);
    var fsw = Math.sin(time*1.1 + fb*1.9) * (3 + wind*5);
    g.strokeStyle = rgba(pal.trees, 0.5);
    g.lineWidth = 7;
    g.beginPath(); g.moveTo(fx2, H + 6);
    g.quadraticCurveTo(fx2 + fsw, H - fh*0.6, fx2 + fsw*2.2, H - fh);
    g.stroke();
  }

  // fireflies (glow on top)
  if (dark > 0.3){
    fireflies.forEach(function(f){
      var x = f.x - camX; if (x < -10 || x > W + 10) return;
      var y = gy(f.z) - (14 + Math.sin(f.ph)*8) * zs(f.z);
      var a = (0.25 + 0.75*Math.abs(Math.sin(f.ph*1.7))) * clamp((dark-0.3)/0.5,0,1);
      var fg2 = g.createRadialGradient(x, y, 0, x, y, 7);
      fg2.addColorStop(0, 'rgba(240,220,130,' + (a*0.9).toFixed(3) + ')');
      fg2.addColorStop(1, 'rgba(240,220,130,0)');
      g.fillStyle = fg2; g.beginPath(); g.arc(x, y, 7, 0, 6.29); g.fill();
    });
  }
  // birds (above everything)
  if (birds.flock){
    var f = birds.flock;
    g.strokeStyle = rgba(pal.trees, 0.85); g.lineWidth = 1.8; g.lineCap = 'round';
    for (var bi2 = 0; bi2 < f.n; bi2++){
      var bx = f.x - camX + bi2*26*f.dir + (bi2%2)*14*f.dir;
      var by = f.y + (bi2%3)*13 + Math.sin(f.ph + bi2)*3;
      var flap = Math.sin(f.ph*2 + bi2) * 4;
      g.beginPath();
      g.moveTo(bx - 7, by + flap); g.quadraticCurveTo(bx, by - 3, bx, by);
      g.quadraticCurveTo(bx, by - 3, bx + 7, by + flap);
      g.stroke();
    }
  }

  // rain veil + streaks (over the world, under the UI)
  if (rain.a > 0.02){
    g.fillStyle = 'rgba(210,220,228,' + (rain.a * 0.10).toFixed(3) + ')';
    g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(225,235,240,' + (rain.a * 0.28).toFixed(3) + ')';
    g.lineWidth = 1.1; g.lineCap = 'round';
    var slant = 5 + wind * 9;
    for (var ri = 0; ri < 110; ri++){
      var rx2 = ((ri * 137.5) % (W + 60)) - 30;
      var ry2 = ((ri * 211.3 + time * 940) % (H + 50)) - 25;
      g.beginPath(); g.moveTo(rx2, ry2); g.lineTo(rx2 + slant * 0.35, ry2 + 13); g.stroke();
    }
  }
  // owl glide
  if (owl.active){
    var ow = Math.abs(Math.sin(owl.ph)) * 9;
    g.fillStyle = 'rgba(30,28,40,0.9)';
    g.beginPath(); g.ellipse(owl.x, owl.y, 7, 4.5, 0, 0, 6.29); g.fill();
    g.beginPath(); g.arc(owl.x + owl.dir * 6, owl.y - 2, 3.4, 0, 6.29); g.fill();
    g.strokeStyle = 'rgba(30,28,40,0.9)'; g.lineWidth = 3.4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(owl.x, owl.y); g.quadraticCurveTo(owl.x - 12, owl.y - 4, owl.x - 20, owl.y - 2 - ow); g.stroke();
    g.beginPath(); g.moveTo(owl.x, owl.y); g.quadraticCurveTo(owl.x + 12, owl.y - 4, owl.x + 20, owl.y - 2 - ow); g.stroke();
  }

  // bubble position over his head
  var mpx = man.x - camX, mpy = gy(man.z) - 78 * zs(man.z);
  bubble.style.left = mpx + 'px';
  bubble.style.top = mpy + 'px';

  window.__sit = function(){ man.state='sit'; man.pauseUntil = performance.now()+12000; man.vx=0; man.vz=0; };
  window.__dbg = 'vx=' + man.vx.toFixed(1) + ' face=' + man.face + ' vf=' + man.visFace.toFixed(2) + ' h=' + man.heading.toFixed(2) + ' | ' + Math.round(man.x) + ',' + man.z.toFixed(2) + ' pd=' + pondD2(man.x, man.z).toFixed(2) + ' ' + man.state + ' spd=' + Math.round(spd) + ' found=' + found + ' t=' + t.toFixed(2) + ' dark=' + dark.toFixed(2);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
