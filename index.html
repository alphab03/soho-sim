<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>soho sim</title>

<!-- PWA: home-screen app -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="soho sim">
<meta name="theme-color" content="#faf5ec">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf5ec;
    --paper:#fffdf8;
    --ink:#3a2f28;
    --terra:#c96f4a;
    --terra-deep:#a85434;
    --sage:#7d8b6f;
    --gold:#d9a441;
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px);
    --sar:env(safe-area-inset-right,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;overflow:hidden;font-family:'Inter',sans-serif;
    background:var(--cream);color:var(--ink);
    position:fixed;width:100%;touch-action:none;overscroll-behavior:none;
    user-select:none;-webkit-user-select:none;
  }

  #map{position:absolute;inset:0;z-index:1;}
  .leaflet-tile-pane{filter:sepia(0.22) saturate(0.82) brightness(1.03) hue-rotate(-8deg);}
  .leaflet-container{font-family:'Inter',sans-serif;background:var(--cream);}
  .leaflet-control-attribution{background:rgba(250,245,236,.7)!important;color:#9a8b7c!important;font-size:9px!important;}
  .leaflet-control-attribution a{color:#9a8b7c!important;}
  .leaflet-control-zoom{display:none;}

  /* ---- title card ---- */
  #title-card{
    position:absolute;top:calc(14px + var(--sat));left:calc(14px + var(--sal));z-index:10;
    background:var(--paper);border-radius:16px;
    padding:11px 17px 9px;
    box-shadow:0 2px 14px rgba(58,47,40,.14), 0 0 0 1px rgba(58,47,40,.05);
    pointer-events:none;
  }
  #title-card h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:24px;
    letter-spacing:-.02em;color:var(--ink);line-height:1;
  }
  #title-card h1 em{color:var(--terra);font-style:italic;}
  #title-card p{
    font-size:10px;color:#a3938a;margin-top:4px;letter-spacing:.05em;
  }

  /* ---- discovery toast ---- */
  #toast{
    position:absolute;top:calc(14px + var(--sat));left:50%;transform:translateX(-50%) translateY(-8px);z-index:12;
    background:var(--paper);border-radius:14px;padding:10px 20px;
    box-shadow:0 4px 18px rgba(58,47,40,.18), 0 0 0 1px rgba(58,47,40,.05);
    font-family:'Fraunces',serif;font-size:16px;font-style:italic;color:var(--terra-deep);
    opacity:0;pointer-events:none;
    transition:opacity .45s, transform .45s;
    white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (max-width:640px){ #toast{ top:calc(118px + var(--sat)); } }
  #toast span{display:block;font-family:'Inter',sans-serif;font-style:normal;font-size:10px;color:#a3938a;letter-spacing:.08em;text-transform:uppercase;margin-top:2px;text-align:center;}

  /* ---- found counter ---- */
  #found{
    position:absolute;top:calc(14px + var(--sat));right:calc(14px + var(--sar));z-index:10;
    background:var(--paper);border-radius:14px;padding:9px 15px;
    box-shadow:0 2px 14px rgba(58,47,40,.14), 0 0 0 1px rgba(58,47,40,.05);
    font-size:11px;color:#7c6d63;text-align:center;pointer-events:none;
  }
  #found b{font-family:'Fraunces',serif;font-size:17px;color:var(--terra-deep);font-weight:600;}

  /* ---- thought bubble ---- */
  #bubble{
    position:absolute;z-index:9;left:-200px;top:-200px;
    transform:translate(-50%,-100%);
    background:var(--paper);border-radius:12px;
    padding:6px 13px;
    font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:#6b5a4e;
    box-shadow:0 2px 10px rgba(58,47,40,.14), 0 0 0 1px rgba(58,47,40,.05);
    opacity:0;pointer-events:none;white-space:nowrap;
    transition:opacity .35s;
  }
  #bubble::after{
    content:'';position:absolute;left:50%;bottom:-5px;
    width:10px;height:10px;background:var(--paper);
    transform:translateX(-50%) rotate(45deg);
    box-shadow:1px 1px 0 rgba(58,47,40,.05);
  }
  #bubble.show{opacity:1;}

  /* ---- character ---- */
  .sim-wrap{pointer-events:none;}
  .sim{width:56px;height:66px;position:relative;}
  .sim svg{width:100%;height:100%;overflow:visible;}
  .sim .leg{transform-origin:24px 0;}
  .sim.walking .leg-l{animation:swingL .38s ease-in-out infinite;}
  .sim.walking .leg-r{animation:swingR .38s ease-in-out infinite;}
  .sim.walking .arm-l{animation:swingR .38s ease-in-out infinite;transform-origin:0 4px;}
  .sim.walking .arm-r{animation:swingL .38s ease-in-out infinite;transform-origin:0 4px;}
  .sim.walking .bod{animation:bob .19s ease-in-out infinite;}
  .sim.running .leg-l{animation-duration:.22s;}
  .sim.running .leg-r{animation-duration:.22s;}
  .sim.running .arm-l{animation-duration:.22s;}
  .sim.running .arm-r{animation-duration:.22s;}
  .sim.running .bod{animation-duration:.11s;}
  .sim.idle .bod{animation:idleSway 2.8s ease-in-out infinite;}
  @keyframes swingL{0%,100%{transform:rotate(16deg);}50%{transform:rotate(-16deg);}}
  @keyframes swingR{0%,100%{transform:rotate(-16deg);}50%{transform:rotate(16deg);}}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-2px);}}
  @keyframes idleSway{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-1.2px) rotate(.6deg);}}
  .sim .facer{transition:transform .12s;}
  .sim.flip .facer{transform:scaleX(-1);}

  /* ---- discovery dots ---- */
  .spot-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--gold);
    border:2px solid var(--paper);
    box-shadow:0 0 0 3px rgba(217,164,65,.3), 0 1px 4px rgba(58,47,40,.25);
    animation:pulse 2.2s ease-in-out infinite;
  }
  .spot-dot.found{background:var(--sage);box-shadow:0 0 0 3px rgba(125,139,111,.3), 0 1px 4px rgba(58,47,40,.25);animation:none;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.35);}}

  /* vignette for soul */
  #vignette{
    position:absolute;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 62%, rgba(120,85,50,.13) 100%);
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="vignette"></div>

<div id="title-card">
  <h1>soho <em>sim</em></h1>
  <p>houston to canal &middot; he wanders on his own</p>
</div>

<div id="found"><b id="found-n">0</b> / <span id="found-total">0</span><br>spots found</div>

<div id="toast"></div>
<div id="bubble"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }

  // ---- SoHo: Houston (N) to Canal (S), 6th Ave (W) to Lafayette (E)
  var START = [40.7247, -74.0006]; // prince & mercer, outside fanelli's
  var BOUNDS = L.latLngBounds([40.7178, -74.0078], [40.7275, -73.9950]);

  var map = L.map('map', {
    center: START,
    zoom: 17.5,
    minZoom: 15.5,
    maxZoom: 19,
    maxBounds: BOUNDS.pad(0.15),
    maxBoundsViscosity: 0.8,
    zoomControl: false,
    attributionControl: true,
    inertia: false,
    zoomSnap: 0.5,
    dragging: false,
    touchZoom: true,
    scrollWheelZoom: true,
    doubleClickZoom: false,
    boxZoom: false,
    keyboard: false
  });

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &middot; Source: Esri, OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  // ---- the little guy ----
  var SIM_SVG =
    '<div class="facer">' +
    '<svg viewBox="0 0 56 66" xmlns="http://www.w3.org/2000/svg">' +
      '<ellipse cx="28" cy="61" rx="12" ry="3.6" fill="rgba(58,47,40,.22)"/>' +
      '<g class="bod">' +
        '<g class="leg leg-l"><rect x="22.5" y="40" width="4.6" height="17" rx="2.3" fill="#5b4a3d"/></g>' +
        '<g class="leg leg-r"><rect x="29" y="40" width="4.6" height="17" rx="2.3" fill="#4e3f34"/></g>' +
        '<rect x="18.5" y="22" width="19" height="21" rx="8" fill="#c96f4a"/>' +
        '<g class="arm arm-l"><rect x="13.5" y="24" width="4.4" height="13" rx="2.2" fill="#b45f3d"/></g>' +
        '<g class="arm arm-r"><rect x="38" y="24" width="4.4" height="13" rx="2.2" fill="#b45f3d"/></g>' +
        '<circle cx="28" cy="13.5" r="9.5" fill="#8a5a3b"/>' +
        '<path d="M18.8 12.5 a9.5 9.5 0 0 1 18.4 0 l-1.6 -3.8 a11 11 0 0 0 -15.2 0 z" fill="#2e2119"/>' +
        '<circle cx="24.6" cy="13.5" r="1.5" fill="#2e2119"/>' +
        '<circle cx="31.4" cy="13.5" r="1.5" fill="#2e2119"/>' +
        '<path d="M25.2 17.4 q2.8 2.2 5.6 0" stroke="#2e2119" stroke-width="1.3" fill="none" stroke-linecap="round"/>' +
        '<rect x="19.6" y="6.2" width="16.8" height="3" rx="1.5" fill="#d9a441"/>' +
      '</g>' +
    '</svg></div>';

  var simIcon = L.divIcon({
    className: 'sim-wrap',
    html: '<div class="sim" id="sim">' + SIM_SVG + '</div>',
    iconSize: [56, 66],
    iconAnchor: [28, 60]
  });

  var pos = L.latLng(START[0], START[1]);
  var marker = L.marker(pos, {icon: simIcon, interactive: false, keyboard: false, zIndexOffset: 1000}).addTo(map);
  var simEl = null;

  // ---- spots he discovers on his walks ----
  var SPOTS = [
    {name:"fanelli's cafe",      sub:"prince & mercer - pouring since 1847", ll:[40.72478,-74.00055]},
    {name:"greene st cast-irons",sub:"the prettiest facades in america",     ll:[40.72360,-74.00200]},
    {name:"crosby st",           sub:"cobblestones and quiet",               ll:[40.72230,-73.99790]},
    {name:"houston & broadway",  sub:"the north wall",                       ll:[40.72550,-73.99610]},
    {name:"canal st",            sub:"the south edge of everything",         ll:[40.71900,-74.00100]},
    {name:"spring st",           sub:"the good block",                       ll:[40.72520,-74.00270]},
    {name:"wooster st",          sub:"gallery row",                          ll:[40.72250,-74.00240]}
  ];
  var found = 0;
  document.getElementById('found-total').textContent = SPOTS.length;

  SPOTS.forEach(function(s){
    s.marker = L.marker(s.ll, {
      interactive: false, keyboard: false,
      icon: L.divIcon({className:'', html:'<div class="spot-dot"></div>', iconSize:[10,10], iconAnchor:[5,5]})
    }).addTo(map);
    s.found = false;
  });

  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(s){
    toast.innerHTML = s.name + '<span>' + s.sub + '</span>';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 3400);
  }

  var bubble = document.getElementById('bubble');
  var bubbleTimer = null;
  function say(text, ms){
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function(){ bubble.classList.remove('show'); }, ms);
  }
  var THOUGHTS = [
    'nice block.',
    'cast iron, pretty.',
    'coffee soon.',
    'quiet here.',
    'this corner again.',
    'love these streets.',
    'hm. good light.',
    'early for the crowd.'
  ];

  // ---- his free will ----
  var STROLL_MIN = 1.4, STROLL_MAX = 2.2, RUN = 5.4; // m/s
  var M_PER_DEG_LAT = 111320;
  function mPerDegLng(lat){ return 111320 * Math.cos(lat * Math.PI/180); }

  var vel = {x:0, y:0};
  var heading = Math.random() * Math.PI * 2; // 0 = north, clockwise
  var state = 'stroll';       // stroll | pause
  var target = null;
  var legSpeed = 1.6;
  var pauseUntil = 0;
  var camCenter = L.latLng(START[0], START[1]);

  function pickTarget(minD, maxD, allowSpot){
    // on stroll legs he sometimes heads for a spot he hasn't found yet
    var un = SPOTS.filter(function(s){ return !s.found; });
    if (allowSpot && un.length && Math.random() < 0.4){
      var s = un[Math.floor(Math.random() * un.length)];
      return L.latLng(s.ll[0], s.ll[1]);
    }
    for (var i = 0; i < 14; i++){
      var t = L.latLng(
        BOUNDS.getSouth() + Math.random() * (BOUNDS.getNorth() - BOUNDS.getSouth()),
        BOUNDS.getWest()  + Math.random() * (BOUNDS.getEast()  - BOUNDS.getWest())
      );
      var d = map.distance(pos, t);
      if (d > minD && d < maxD) return t;
    }
    return L.latLng(40.7236, -74.0020); // greene st, always a good idea
  }

  function newLeg(){
    state = 'stroll';
    if (Math.random() < 0.12){
      legSpeed = RUN;                    // occasionally he's in a hurry -
      target = pickTarget(70, 150, false); // but only for a block or two
    } else {
      legSpeed = STROLL_MIN + Math.random() * (STROLL_MAX - STROLL_MIN);
      target = pickTarget(90, 220, true);
    }
  }

  function wrapAngle(a){
    while (a > Math.PI) a -= 2 * Math.PI;
    while (a < -Math.PI) a += 2 * Math.PI;
    return a;
  }

  var last = performance.now();

  function frame(now){
    var dt = Math.min((now - last)/1000, 0.05);
    last = now;

    var targetSpeed = 0;

    if (state === 'pause'){
      if (now >= pauseUntil) newLeg();
    } else {
      if (!target) newLeg();
      var dx = (target.lng - pos.lng) * mPerDegLng(pos.lat);
      var dy = (target.lat - pos.lat) * M_PER_DEG_LAT;
      var dist = Math.hypot(dx, dy);
      if (dist < 9){
        state = 'pause';
        var pauseMs = 2200 + Math.random() * 4200;
        pauseUntil = now + pauseMs;
        target = null;
        if (Math.random() < 0.45){
          say(THOUGHTS[Math.floor(Math.random() * THOUGHTS.length)], Math.min(pauseMs - 500, 3200));
        }
      } else {
        var desired = Math.atan2(dx, dy);
        var dh = wrapAngle(desired - heading);
        var maxTurn = 2.3 * dt;
        heading += Math.max(-maxTurn, Math.min(maxTurn, dh));
        heading += Math.sin(now * 0.0011) * 0.14 * dt; // gentle meander
        targetSpeed = legSpeed * Math.max(0.35, Math.cos(dh)); // slow into turns
      }
    }

    // momentum: ease toward intended velocity
    var tx = Math.sin(heading) * targetSpeed;
    var ty = Math.cos(heading) * targetSpeed;
    var k = 1 - Math.exp(-dt / 0.28);
    vel.x += (tx - vel.x) * k;
    vel.y += (ty - vel.y) * k;
    var spd = Math.hypot(vel.x, vel.y);

    if (spd > 0.08){
      var nLat = pos.lat + (vel.y * dt) / M_PER_DEG_LAT;
      var nLng = pos.lng + (vel.x * dt) / mPerDegLng(pos.lat);
      nLat = Math.max(BOUNDS.getSouth(), Math.min(BOUNDS.getNorth(), nLat));
      nLng = Math.max(BOUNDS.getWest(), Math.min(BOUNDS.getEast(), nLng));
      pos = L.latLng(nLat, nLng);
      marker.setLatLng(pos);

      if (!simEl) simEl = document.getElementById('sim');
      if (simEl){
        var walking = spd > 0.25;
        simEl.classList.toggle('walking', walking && spd <= 3.4);
        simEl.classList.toggle('running', spd > 3.4);
        simEl.classList.toggle('idle', !walking);
        if (vel.x < -0.15) simEl.classList.add('flip');
        else if (vel.x > 0.15) simEl.classList.remove('flip');
      }

      // discoveries
      SPOTS.forEach(function(s){
        if (!s.found && map.distance(pos, s.ll) < 40){
          s.found = true; found++;
          var el = s.marker.getElement();
          if (el) el.querySelector('.spot-dot').classList.add('found');
          document.getElementById('found-n').textContent = found;
          showToast(s);
          state = 'pause';
          pauseUntil = now + 4600;
          target = null;
        }
      });
    } else if (simEl){
      simEl.classList.remove('walking','running');
      simEl.classList.add('idle');
    }

    // buttery camera: drifts after him, never snaps
    var ck = 1 - Math.exp(-dt * 3.2);
    camCenter = L.latLng(
      camCenter.lat + (pos.lat - camCenter.lat) * ck,
      camCenter.lng + (pos.lng - camCenter.lng) * ck
    );
    map.panTo(camCenter, {animate: false});

    // keep the bubble floating over his head
    var pt = map.latLngToContainerPoint(pos);
    bubble.style.left = pt.x + 'px';
    bubble.style.top = (pt.y - 74) + 'px';

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('resize', function(){ map.panTo(camCenter, {animate:false}); });
})();
</script>
</body>
</html>
