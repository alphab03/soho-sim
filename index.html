<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>soho sim</title>

<!-- PWA: home-screen app -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="soho sim">
<meta name="theme-color" content="#faf5ec">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf5ec;
    --paper:#fffdf8;
    --ink:#3a2f28;
    --terra:#c96f4a;
    --terra-deep:#a85434;
    --sage:#7d8b6f;
    --gold:#d9a441;
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px);
    --sar:env(safe-area-inset-right,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;overflow:hidden;font-family:'Inter',sans-serif;
    background:var(--cream);color:var(--ink);
    position:fixed;width:100%;touch-action:none;overscroll-behavior:none;
  }

  #map{position:absolute;inset:0;z-index:1;}
  .leaflet-tile-pane{filter:sepia(0.22) saturate(0.82) brightness(1.03) hue-rotate(-8deg);}
  .leaflet-container{font-family:'Inter',sans-serif;background:var(--cream);}
  .leaflet-control-attribution{background:rgba(250,245,236,.7)!important;color:#9a8b7c!important;font-size:9px!important;}
  .leaflet-control-attribution a{color:#9a8b7c!important;}
  .leaflet-control-zoom{display:none;}

  /* ---- title card ---- */
  #title-card{
    position:absolute;top:calc(14px + var(--sat));left:calc(14px + var(--sal));z-index:10;
    background:var(--paper);border-radius:16px;
    padding:11px 17px 9px;
    box-shadow:0 2px 14px rgba(58,47,40,.14), 0 0 0 1px rgba(58,47,40,.05);
    user-select:none;
  }
  #title-card h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:24px;
    letter-spacing:-.02em;color:var(--ink);line-height:1;
  }
  #title-card h1 em{color:var(--terra);font-style:italic;}
  #title-card p{
    font-size:10px;color:#a3938a;margin-top:4px;letter-spacing:.05em;
  }

  /* ---- hint pill ---- */
  #hint{
    position:absolute;bottom:calc(22px + var(--sab));left:50%;transform:translateX(-50%);z-index:10;
    background:rgba(255,253,248,.92);backdrop-filter:blur(6px);
    border-radius:999px;padding:8px 18px;
    font-size:12px;color:#7c6d63;letter-spacing:.02em;
    box-shadow:0 2px 12px rgba(58,47,40,.12), 0 0 0 1px rgba(58,47,40,.05);
    white-space:nowrap;user-select:none;
    transition:opacity 1s;
  }
  #hint .k{
    display:inline-block;background:var(--cream);border:1px solid #e4d9c8;border-bottom-width:2px;
    border-radius:5px;padding:1px 6px;font-size:11px;font-weight:600;color:var(--ink);
    margin:0 1px;
  }

  /* ---- discovery toast ---- */
  #toast{
    position:absolute;top:calc(14px + var(--sat));left:50%;transform:translateX(-50%) translateY(-8px);z-index:12;
    background:var(--paper);border-radius:14px;padding:10px 20px;
    box-shadow:0 4px 18px rgba(58,47,40,.18), 0 0 0 1px rgba(58,47,40,.05);
    font-family:'Fraunces',serif;font-size:16px;font-style:italic;color:var(--terra-deep);
    opacity:0;pointer-events:none;
    transition:opacity .45s, transform .45s;
    white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast span{display:block;font-family:'Inter',sans-serif;font-style:normal;font-size:10px;color:#a3938a;letter-spacing:.08em;text-transform:uppercase;margin-top:2px;text-align:center;}

  /* ---- found counter ---- */
  #found{
    position:absolute;top:calc(14px + var(--sat));right:calc(14px + var(--sar));z-index:10;
    background:var(--paper);border-radius:14px;padding:9px 15px;
    box-shadow:0 2px 14px rgba(58,47,40,.14), 0 0 0 1px rgba(58,47,40,.05);
    font-size:11px;color:#7c6d63;user-select:none;text-align:center;
  }
  #found b{font-family:'Fraunces',serif;font-size:17px;color:var(--terra-deep);font-weight:600;}

  /* ---- character ---- */
  .sim-wrap{pointer-events:none;}
  .sim{width:56px;height:66px;position:relative;}
  .sim svg{width:100%;height:100%;overflow:visible;}
  .sim .leg{transform-origin:24px 0;}
  .sim.walking .leg-l{animation:swingL .34s ease-in-out infinite;}
  .sim.walking .leg-r{animation:swingR .34s ease-in-out infinite;}
  .sim.walking .arm-l{animation:swingR .34s ease-in-out infinite;transform-origin:0 4px;}
  .sim.walking .arm-r{animation:swingL .34s ease-in-out infinite;transform-origin:0 4px;}
  .sim.walking .bod{animation:bob .17s ease-in-out infinite;}
  .sim.running .leg-l{animation-duration:.22s;}
  .sim.running .leg-r{animation-duration:.22s;}
  .sim.running .arm-l{animation-duration:.22s;}
  .sim.running .arm-r{animation-duration:.22s;}
  .sim.running .bod{animation-duration:.11s;}
  @keyframes swingL{0%,100%{transform:rotate(18deg);}50%{transform:rotate(-18deg);}}
  @keyframes swingR{0%,100%{transform:rotate(-18deg);}50%{transform:rotate(18deg);}}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-2.5px);}}
  .sim .facer{transition:transform .12s;}
  .sim.flip .facer{transform:scaleX(-1);}

  /* ---- discovery dots ---- */
  .spot-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--gold);
    border:2px solid var(--paper);
    box-shadow:0 0 0 3px rgba(217,164,65,.3), 0 1px 4px rgba(58,47,40,.25);
    animation:pulse 2.2s ease-in-out infinite;
  }
  .spot-dot.found{background:var(--sage);box-shadow:0 0 0 3px rgba(125,139,111,.3), 0 1px 4px rgba(58,47,40,.25);animation:none;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.35);}}

  /* ---- touch controls ---- */
  #joy{
    position:absolute;bottom:calc(64px + var(--sab));left:calc(22px + var(--sal));z-index:11;
    width:118px;height:118px;border-radius:50%;
    background:rgba(255,253,248,.55);backdrop-filter:blur(4px);
    border:1.5px solid rgba(58,47,40,.15);
    display:none;touch-action:none;
  }
  #joy-knob{
    position:absolute;left:50%;top:50%;
    width:48px;height:48px;border-radius:50%;
    background:var(--paper);
    box-shadow:0 2px 8px rgba(58,47,40,.25), 0 0 0 1px rgba(58,47,40,.08);
    transform:translate(-50%,-50%);
  }
  #run-btn{
    position:absolute;bottom:calc(84px + var(--sab));right:calc(22px + var(--sar));z-index:11;
    width:76px;height:76px;border-radius:50%;
    background:var(--paper);border:1.5px solid rgba(58,47,40,.12);
    box-shadow:0 2px 10px rgba(58,47,40,.18);
    font-family:'Fraunces',serif;font-style:italic;font-size:15px;color:var(--terra-deep);
    display:none;align-items:center;justify-content:center;
    touch-action:none;user-select:none;
  }
  #run-btn.on{background:var(--terra);color:var(--paper);border-color:var(--terra-deep);}
  body.touch #joy{display:block;}
  body.touch #run-btn{display:flex;}
  body.touch #hint{bottom:auto;top:calc(78px + var(--sat));font-size:11px;opacity:.85;}

  /* vignette for soul */
  #vignette{
    position:absolute;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 62%, rgba(120,85,50,.13) 100%);
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="vignette"></div>

<div id="title-card">
  <h1>soho <em>sim</em></h1>
  <p>houston to canal &middot; a little wander</p>
</div>

<div id="found"><b id="found-n">0</b> / <span id="found-total">0</span><br>spots found</div>

<div id="hint">
  <span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span> or arrows to wander &nbsp;&middot;&nbsp; <span class="k">shift</span> to run
</div>

<div id="toast"></div>

<div id="joy"><div id="joy-knob"></div></div>
<div id="run-btn">run</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  // register the service worker for home-screen install
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }

  // ---- SoHo bounds: Houston (N) to Canal (S), 6th Ave (W) to Lafayette (E)
  var START = [40.7247, -74.0006]; // prince & mercer, outside fanelli's
  var BOUNDS = L.latLngBounds([40.7178, -74.0078], [40.7275, -73.9950]);

  var map = L.map('map', {
    center: START,
    zoom: 17.5,
    minZoom: 15.5,
    maxZoom: 19,
    maxBounds: BOUNDS.pad(0.15),
    maxBoundsViscosity: 0.8,
    zoomControl: false,
    attributionControl: true,
    inertia: false,
    zoomSnap: 0.5,
    dragging: false,          // camera stays glued to the little guy
    touchZoom: true,
    scrollWheelZoom: true,
    doubleClickZoom: false,
    boxZoom: false,
    keyboard: false
  });

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &middot; Source: Esri, OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  // ---- the little guy ----
  var SIM_SVG =
    '<div class="facer">' +
    '<svg viewBox="0 0 56 66" xmlns="http://www.w3.org/2000/svg">' +
      '<ellipse cx="28" cy="61" rx="12" ry="3.6" fill="rgba(58,47,40,.22)"/>' +
      '<g class="bod">' +
        '<g class="leg leg-l"><rect x="22.5" y="40" width="4.6" height="17" rx="2.3" fill="#5b4a3d"/></g>' +
        '<g class="leg leg-r"><rect x="29" y="40" width="4.6" height="17" rx="2.3" fill="#4e3f34"/></g>' +
        '<rect x="18.5" y="22" width="19" height="21" rx="8" fill="#c96f4a"/>' +
        '<g class="arm arm-l"><rect x="13.5" y="24" width="4.4" height="13" rx="2.2" fill="#b45f3d"/></g>' +
        '<g class="arm arm-r"><rect x="38" y="24" width="4.4" height="13" rx="2.2" fill="#b45f3d"/></g>' +
        '<circle cx="28" cy="13.5" r="9.5" fill="#8a5a3b"/>' +
        '<path d="M18.8 12.5 a9.5 9.5 0 0 1 18.4 0 l-1.6 -3.8 a11 11 0 0 0 -15.2 0 z" fill="#2e2119"/>' +
        '<circle cx="24.6" cy="13.5" r="1.5" fill="#2e2119"/>' +
        '<circle cx="31.4" cy="13.5" r="1.5" fill="#2e2119"/>' +
        '<path d="M25.2 17.4 q2.8 2.2 5.6 0" stroke="#2e2119" stroke-width="1.3" fill="none" stroke-linecap="round"/>' +
        '<rect x="19.6" y="6.2" width="16.8" height="3" rx="1.5" fill="#d9a441"/>' +
      '</g>' +
    '</svg></div>';

  var simIcon = L.divIcon({
    className: 'sim-wrap',
    html: '<div class="sim" id="sim">' + SIM_SVG + '</div>',
    iconSize: [56, 66],
    iconAnchor: [28, 60]
  });

  var pos = L.latLng(START[0], START[1]);
  var marker = L.marker(pos, {icon: simIcon, interactive: false, keyboard: false, zIndexOffset: 1000}).addTo(map);
  var simEl = null;

  // ---- spots to discover ----
  var SPOTS = [
    {name:"fanelli's cafe",      sub:"prince & mercer - pouring since 1847", ll:[40.72478,-74.00055]},
    {name:"greene st cast-irons",sub:"the prettiest facades in america",     ll:[40.72360,-74.00200]},
    {name:"crosby st",           sub:"cobblestones and quiet",               ll:[40.72230,-73.99790]},
    {name:"houston & broadway",  sub:"the north wall",                       ll:[40.72550,-73.99610]},
    {name:"canal st",            sub:"the south edge of everything",         ll:[40.71900,-74.00100]},
    {name:"spring st",           sub:"the good block",                       ll:[40.72520,-74.00270]},
    {name:"wooster st",          sub:"gallery row",                          ll:[40.72250,-74.00240]}
  ];
  var found = 0;
  document.getElementById('found-total').textContent = SPOTS.length;

  SPOTS.forEach(function(s){
    s.marker = L.marker(s.ll, {
      interactive: false, keyboard: false,
      icon: L.divIcon({className:'', html:'<div class="spot-dot"></div>', iconSize:[10,10], iconAnchor:[5,5]})
    }).addTo(map);
    s.found = false;
  });

  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(s){
    toast.innerHTML = s.name + '<span>' + s.sub + '</span>';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 3200);
  }

  // ---- input ----
  var keys = {};
  window.addEventListener('keydown', function(e){
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key) >= 0) e.preventDefault();
    keys[e.key.toLowerCase()] = true;
  });
  window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

  var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || /[?&]touch/.test(location.search);
  if (isTouch) document.body.classList.add('touch');

  var joyVec = {x:0, y:0};
  var joyEl = document.getElementById('joy');
  var knob = document.getElementById('joy-knob');
  var joyId = null, joyRun = false, touchRun = false;

  function joyCenter(){
    var r = joyEl.getBoundingClientRect();
    return {x: r.left + r.width/2, y: r.top + r.height/2, rad: r.width/2};
  }
  joyEl.addEventListener('pointerdown', function(e){
    joyId = e.pointerId; joyEl.setPointerCapture(joyId); moveJoy(e);
  });
  joyEl.addEventListener('pointermove', function(e){ if (e.pointerId === joyId) moveJoy(e); });
  function endJoy(e){
    if (e.pointerId !== joyId) return;
    joyId = null; joyVec = {x:0,y:0}; joyRun = false;
    knob.style.transform = 'translate(-50%,-50%)';
  }
  joyEl.addEventListener('pointerup', endJoy);
  joyEl.addEventListener('pointercancel', endJoy);
  function moveJoy(e){
    var c = joyCenter();
    var dx = e.clientX - c.x, dy = e.clientY - c.y;
    var d = Math.hypot(dx, dy) || 1;
    var clamped = Math.min(d, c.rad);
    var nx = dx/d, ny = dy/d;
    knob.style.transform = 'translate(calc(-50% + ' + (nx*clamped) + 'px), calc(-50% + ' + (ny*clamped) + 'px))';
    var m = clamped / c.rad;
    joyVec = {x: nx*m, y: ny*m};
    joyRun = m > 0.92;
  }

  var runBtn = document.getElementById('run-btn');
  runBtn.addEventListener('pointerdown', function(e){
    e.preventDefault();
    touchRun = !touchRun;
    runBtn.classList.toggle('on', touchRun);
  });

  // ---- movement ----
  var WALK = 3.4, RUN = 8.2; // meters per second
  var M_PER_DEG_LAT = 111320;
  var last = performance.now();
  var hintFaded = false;

  function mPerDegLng(lat){ return 111320 * Math.cos(lat * Math.PI/180); }

  function frame(now){
    var dt = Math.min((now - last)/1000, 0.05);
    last = now;

    var dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy += 1;
    if (keys['s'] || keys['arrowdown']) dy -= 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    var running = !!(keys['shift']);
    if (joyVec.x || joyVec.y){ dx += joyVec.x; dy -= joyVec.y; if (joyRun) running = true; }
    if (touchRun && (dx || dy)) running = true;

    var mag = Math.hypot(dx, dy);
    if (mag > 1){ dx /= mag; dy /= mag; mag = 1; }
    var moving = mag > 0.02;

    if (moving){
      if (!hintFaded){ document.getElementById('hint').style.opacity = '0.45'; hintFaded = true; }
      var speed = running ? RUN : WALK;
      var dLat = (dy * speed * mag * dt) / M_PER_DEG_LAT;
      var dLng = (dx * speed * mag * dt) / mPerDegLng(pos.lat);
      var nLat = pos.lat + dLat, nLng = pos.lng + dLng;
      nLat = Math.max(BOUNDS.getSouth(), Math.min(BOUNDS.getNorth(), nLat));
      nLng = Math.max(BOUNDS.getWest(), Math.min(BOUNDS.getEast(), nLng));
      pos = L.latLng(nLat, nLng);
      marker.setLatLng(pos);
      map.panTo(pos, {animate: false});

      if (!simEl) simEl = document.getElementById('sim');
      if (simEl){
        simEl.classList.add('walking');
        simEl.classList.toggle('running', running);
        if (dx < -0.05) simEl.classList.add('flip');
        else if (dx > 0.05) simEl.classList.remove('flip');
      }

      SPOTS.forEach(function(s){
        if (!s.found && map.distance(pos, s.ll) < 45){
          s.found = true; found++;
          var el = s.marker.getElement();
          if (el) el.querySelector('.spot-dot').classList.add('found');
          document.getElementById('found-n').textContent = found;
          showToast(s);
        }
      });
    } else if (simEl){
      simEl.classList.remove('walking','running');
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('resize', function(){ map.panTo(pos, {animate:false}); });
})();
</script>
</body>
</html>
