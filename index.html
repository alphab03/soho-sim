<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>valley sim</title>

<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="valley sim">
<meta name="theme-color" content="#faf5ec">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf5ec; --paper:#fffdf8; --ink:#3a2f28;
    --terra:#c96f4a; --terra-deep:#a85434; --sage:#7d8b6f; --gold:#d9a441;
    --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px); --sal:env(safe-area-inset-left,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#f2efe0;
    position:fixed;width:100%;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;}
  #scene{position:absolute;inset:0;z-index:1;display:block;}

  #title-card{
    position:absolute;top:calc(14px + var(--sat));left:calc(14px + var(--sal));z-index:10;
    background:rgba(255,253,248,.9);backdrop-filter:blur(6px);border-radius:16px;
    padding:11px 17px 9px;box-shadow:0 2px 14px rgba(58,47,40,.14), 0 0 0 1px rgba(58,47,40,.05);
    pointer-events:none;
  }
  #title-card h1{font-family:'Fraunces',serif;font-weight:600;font-size:24px;letter-spacing:-.02em;color:var(--ink);line-height:1;}
  #title-card h1 em{color:var(--terra);font-style:italic;}
  #title-card p{font-size:10px;color:#a3938a;margin-top:4px;letter-spacing:.05em;}

  #found{
    position:absolute;top:calc(14px + var(--sat));right:calc(14px + var(--sar));z-index:10;
    background:rgba(255,253,248,.9);backdrop-filter:blur(6px);border-radius:14px;padding:9px 15px;
    box-shadow:0 2px 14px rgba(58,47,40,.14), 0 0 0 1px rgba(58,47,40,.05);
    font-size:11px;color:#7c6d63;text-align:center;pointer-events:none;
  }
  #found b{font-family:'Fraunces',serif;font-size:17px;color:var(--terra-deep);font-weight:600;}

  #toast{
    position:absolute;top:calc(118px + var(--sat));left:50%;transform:translateX(-50%) translateY(-8px);z-index:12;
    background:var(--paper);border-radius:14px;padding:10px 20px;
    box-shadow:0 4px 18px rgba(58,47,40,.18), 0 0 0 1px rgba(58,47,40,.05);
    font-family:'Fraunces',serif;font-size:16px;font-style:italic;color:var(--terra-deep);
    opacity:0;pointer-events:none;transition:opacity .45s, transform .45s;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast span{display:block;font-family:'Inter',sans-serif;font-style:normal;font-size:10px;color:#a3938a;
    letter-spacing:.08em;text-transform:uppercase;margin-top:2px;text-align:center;}

  .bub{
    position:absolute;z-index:9;left:-200px;top:-200px;transform:translate(-50%,-100%);
    background:var(--paper);border-radius:12px;padding:6px 13px;
    font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:#6b5a4e;
    box-shadow:0 2px 10px rgba(58,47,40,.14), 0 0 0 1px rgba(58,47,40,.05);
    opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .35s;
  }
  .bub::after{content:'';position:absolute;left:50%;bottom:-5px;width:10px;height:10px;
    background:var(--paper);transform:translateX(-50%) rotate(45deg);box-shadow:1px 1px 0 rgba(58,47,40,.05);}
  .bub.show{opacity:1;}

  #notes{
    position:absolute;bottom:calc(16px + var(--sab));left:calc(14px + var(--sal));z-index:11;
    width:min(320px,74vw);pointer-events:auto;cursor:pointer;
  }
  #notes-head{font-family:'Fraunces',serif;font-style:italic;font-size:12.5px;color:#8a796d;
    letter-spacing:.04em;margin:0 0 5px 4px;opacity:.95;text-shadow:0 1px 2px rgba(255,253,248,.6);}
  #notes-n{display:inline-block;min-width:16px;text-align:center;background:var(--terra);color:var(--paper);
    border-radius:8px;font-family:'Inter',sans-serif;font-style:normal;font-size:9.5px;font-weight:600;
    padding:1px 4px;margin-left:6px;vertical-align:2px;}
  #notes-n:empty{display:none;}
  .note{
    background:rgba(255,253,248,.93);backdrop-filter:blur(6px);border-radius:13px;
    padding:9px 14px 8px;margin-top:6px;display:none;
    box-shadow:0 2px 12px rgba(58,47,40,.13), 0 0 0 1px rgba(58,47,40,.05);
    font-family:'Fraunces',serif;font-size:13.5px;line-height:1.35;color:#4a3d33;
    animation:notein .6s ease both;
  }
  .note:first-child{display:block;}
  #notes.open .note{display:block;}
  .note span{display:block;font-family:'Inter',sans-serif;font-size:9.5px;color:#a3938a;
    letter-spacing:.05em;margin-top:3px;}
  .note .act{display:none;margin-top:6px;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.06em;
    color:var(--terra-deep);background:rgba(201,111,74,.12);border:1px solid rgba(168,84,52,.35);
    border-radius:8px;padding:4px 10px;}
  #notes.open .act{display:inline-block;}
  @keyframes notein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  #notes-n.pop{animation:npop .5s ease;}
  @keyframes npop{0%{transform:scale(1);}40%{transform:scale(1.5);}100%{transform:scale(1);}}

  #vignette{position:absolute;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 60%, rgba(120,85,50,.14) 100%);}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="title-card"><h1>valley <em>sim</em></h1><p>they wander for their people</p></div>
<div id="found"><b id="found-n">0</b> / <span id="found-total">0</span><br>places found</div>
<div id="toast"></div>
<div id="notes"><div id="notes-head">field notes<span id="notes-n"></span></div><div id="notes-list"></div></div>

<script>
(function(){
'use strict';
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });

// ---------- params ----------
var Q = new URLSearchParams(location.search);
var DAY_LEN = parseFloat(Q.get('day')) || 420;          // seconds per full day
var T0 = Q.has('t') ? parseFloat(Q.get('t')) : 0.30;    // start time of day (morning)
var DEBUG = Q.has('debug');
var START_X = parseFloat(Q.get('x')) || 2260;
var START_Z = parseFloat(Q.get('z')) || 0.58;
var WORLD_W = 4400;

// ---------- canvas ----------
var canvas = document.getElementById('scene');
var g = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1, horizonY = 0, meadowH = 0;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  horizonY = H * 0.46; meadowH = H - horizonY;
}
window.addEventListener('resize', resize);
resize();

// ---------- helpers ----------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function lerp(a,b,k){ return a+(b-a)*k; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function smooth(k){ return k*k*(3-2*k); }
function hex(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function carr(c){ return typeof c === 'string' ? c.match(/[\d.]+/g).map(Number) : c; }
function lerpC(c1,c2,k){ c1=carr(c1); c2=carr(c2); return 'rgb(' + Math.round(lerp(c1[0],c2[0],k)) + ',' + Math.round(lerp(c1[1],c2[1],k)) + ',' + Math.round(lerp(c1[2],c2[2],k)) + ')'; }
function rgba(c,a){ c=carr(c); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

// ---------- palettes (dawn / day / dusk / night) ----------
var PALS = {
  night: { skyTop:'#232a44', skyBot:'#4a4460', ridgeFar:'#3f4761', ridgeMid:'#343c50', trees:'#2c3634', mead1:'#4b5545', mead2:'#3a473c', water:'#31405a', cloud:'#565a74', dark:1.0 },
  dawn:  { skyTop:'#e0a87f', skyBot:'#f7e3c2', ridgeFar:'#c9a48f', ridgeMid:'#ab8878', trees:'#6f7a5e', mead1:'#b8a470', mead2:'#9a885e', water:'#e6c49c', cloud:'#f2d7bd', dark:0.30 },
  day:   { skyTop:'#a5d2de', skyBot:'#f2efe0', ridgeFar:'#bccbb2', ridgeMid:'#97ab8f', trees:'#5f7a52', mead1:'#b3c682', mead2:'#94a968', water:'#a8d0d8', cloud:'#ffffff', dark:0.0 },
  dusk:  { skyTop:'#e08a5f', skyBot:'#f8d09a', ridgeFar:'#c08f7c', ridgeMid:'#9c7266', trees:'#5d5f46', mead1:'#bb9558', mead2:'#967048', water:'#eeb787', cloud:'#f6bf9a', dark:0.38 }
};
Object.keys(PALS).forEach(function(k){ var p=PALS[k]; Object.keys(p).forEach(function(f){ if(f!=='dark') p[f]=hex(p[f]); }); });
// anchors through the day
var ANCHORS = [ [0.00,'night'], [0.20,'night'], [0.26,'dawn'], [0.36,'day'], [0.68,'day'], [0.78,'dusk'], [0.86,'night'], [1.00,'night'] ];
function palAt(t){
  var i;
  for (i=0;i<ANCHORS.length-1;i++) if (t >= ANCHORS[i][0] && t <= ANCHORS[i+1][0]) break;
  var a = PALS[ANCHORS[i][1]], b = PALS[ANCHORS[i+1][1]];
  var k = smooth(clamp((t - ANCHORS[i][0]) / (ANCHORS[i+1][0] - ANCHORS[i][0]), 0, 1));
  var out = {};
  Object.keys(a).forEach(function(f){ out[f] = (f==='dark') ? lerp(a[f],b[f],k) : lerpC(a[f],b[f],k); });
  out.darkRaw = out.dark;
  return out;
}
function sunPos(t){ // t in [0.25,0.75] day arc
  var k = (t - 0.25) / 0.5;
  return { x: W * (0.12 + 0.76 * k), y: horizonY - Math.sin(k * Math.PI) * horizonY * 0.78, up: Math.sin(k * Math.PI) };
}
function moonPos(t){
  var k = (t >= 0.75) ? (t - 0.75) / 0.5 : (t + 0.25) / 0.5;
  return { x: W * (0.15 + 0.7 * k), y: horizonY - Math.sin(k * Math.PI) * horizonY * 0.6, up: Math.sin(k * Math.PI) };
}

// ---------- world features ----------
var PLACES = [
  { id:'field',  name:'the flower field', sub:'smells like summer',    x:560,  z:0.62, r:170, sit:false },
  { id:'oak',    name:'the old oak',      sub:'older than the valley', x:1080, z:0.34, r:110, sit:true  },
  { id:'pond',   name:'the pond',         sub:'still water',           x:1900, z:0.42, r:150, sit:true  },
  { id:'fire',   name:'the campfire',     sub:'warm even unlit',       x:3050, z:0.60, r:110, sit:true  },
  { id:'rock',   name:'the overlook',     sub:'can see everything',    x:3750, z:0.30, r:110, sit:false },
  { id:'dock',   name:'the dock',         sub:'feet over the water',     x:1800, z:0.50, r:70,  sit:true  }
];
PLACES.forEach(function(p){ p.found = false; });

// the pond is water - he walks around it, not through it
var POND = { x: 1900, z: 0.44, rx: 250, rz: 0.115 };
var DOCK = { ax: 1690, az: 0.50, bx: 1800, bz: 0.50, approach: { x: 1680, z: 0.62 } };
function pondD2(x, z){ var ex = (x - POND.x)/POND.rx, ez = (z - POND.z)/POND.rz; return ex*ex + ez*ez; }

// the creek - outflow from the pond, meanders toward the camera
var CREEK = [ {x:1900,z:0.53}, {x:1975,z:0.62}, {x:1915,z:0.74}, {x:2025,z:0.88}, {x:1985,z:1.06} ];
function creekD(x, z){
  var best = 1e9;
  for (var ci = 0; ci < CREEK.length - 1; ci++){
    var a = CREEK[ci], b = CREEK[ci+1];
    var ax = a.x, ay = a.z*900, bx = b.x, by = b.z*900;
    var dx = bx-ax, dy = by-ay, len2 = dx*dx + dy*dy;
    var tt = ((x-ax)*dx + (z*900-ay)*dy) / len2;
    tt = Math.max(0, Math.min(1, tt));
    var ex2 = ax + dx*tt - x, ey2 = ay + dy*tt - z*900;
    var d2 = ex2*ex2 + ey2*ey2;
    if (d2 < best) best = d2;
  }
  return Math.sqrt(best);
}
// ---------- his house - the whole world now ----------
// alpha's character lives here. tap / keys walk him; left alone he lives on his own:
// he brings things home, arranges them, tends his plants, sleeps when it's late.
var HOUSE_MODE = !Q.has('valley');
var ROOM_W = 2100;
var HFIX = { doorX: 160, winX0: 880, winX1: 1180, fireX: 560, bedX: 1920 };
var HITEMS_DEF = [
  { id:'rug',    name:'a braided rug',      sub:'soft underfoot',          kind:'rug' },
  { id:'plant1', name:'a fiddle-leaf fig',  sub:'needs the light',         kind:'plant',  act:'tend' },
  { id:'shelf',  name:'a bookshelf',        sub:'borrowed stories',        kind:'shelf',  act:'browse' },
  { id:'chair',  name:'the armchair',       sub:'his spot',                kind:'chair',  act:'read' },
  { id:'desk',   name:'a writing desk',     sub:'ink and paper',           kind:'desk',   act:'write' },
  { id:'lamp',   name:'a floor lamp',       sub:'a pool of light',         kind:'lamp' },
  { id:'plant2', name:'a hanging fern',     sub:'by the window',           kind:'hplant', act:'tend' },
  { id:'table',  name:'a side table',       sub:'tea things',              kind:'table' },
  { id:'art',    name:'a framed print',     sub:'the valley, remembered',  kind:'art' },
  { id:'plant3', name:'a little succulent', sub:'on the sill',             kind:'splant' },
  { id:'kettle', name:'a copper kettle',    sub:'tea, properly',           kind:'kettle', act:'tea' },
  { id:'cat',    name:'a cat',              sub:'it chose him',            kind:'cat',    act:'pet' }
];
function hDef(id){ for (var i = 0; i < HITEMS_DEF.length; i++) if (HITEMS_DEF[i].id === id) return HITEMS_DEF[i]; return null; }
var HANCHORS = {
  rug:    [[680,0.745],[1400,0.745]],
  plant1: [[1260,0.60],[310,0.60],[1560,0.60]],
  shelf:  [[1650,0.585],[350,0.585]],
  chair:  [[745,0.72],[1210,0.72]],
  desk:   [[1370,0.605],[250,0.605]],
  lamp:   [[1490,0.60],[650,0.62]],
  plant2: [[905],[1155]],
  table:  [[810,0.68],[1450,0.68]],
  art:    [[1430],[720]],
  plant3: [[955],[1110]],
  kettle: [[560,0.60]],
  cat:    [[690,0.755],[1900,0.73],[1040,0.63],[745,0.72]]
};
var HACT_LINES = {
  gaze:   ['the light changes.','weather coming.','quiet out there.','the valley, framed.'],
  warm:   ['warm.','one more log.','the fire knows.'],
  sleep:  [],
  tend:   ['drink up.','new leaf.','growing.'],
  browse: ['this one again.','a good spine.','borrowed stories.'],
  read:   ['one more page.','his spot.','mm.'],
  write:  ['dear...','ink first.','a letter, maybe.'],
  tea:    ['steep.','properly warm.','tea time.'],
  pet:    ['there it is.','purr.','who chose who.']
};
var hstate = {
  items: [],                 // placed: { id, x, z }
  next: -1,                  // worldAge of next arrival (-1 = unset until load)
  rearr: -1,
  carry: null,               // def being carried in
  carryBox: false,           // carrying a plain box (pre-placement)
  moving: null,              // item being rearranged
  fireP: [],
  rain: 0, raining: false, rainT: 45,
  birds: null, birdsT: 18,
  catT: 40, catMove: null,
  dust: [],
  fetchT: 0, idleT: 0
};
for (var hd = 0; hd < 14; hd++) hstate.dust.push({ x: 880 + Math.random()*300, y: 0, vy: 4 + Math.random()*6, ph: Math.random()*6.28 });
function hHas(id){ return hstate.items.some(function(it){ return it.id === id; }); }
function hItem(id){ for (var i = 0; i < hstate.items.length; i++) if (hstate.items[i].id === id) return hstate.items[i]; return null; }
function hFreeAnchor(id){
  var opts = HANCHORS[id] || [];
  for (var i = 0; i < opts.length; i++){
    var a = opts[i], clash = false;
    hstate.items.forEach(function(it){
      var d2 = hDef(it.id);
      if (d2 && d2.kind !== 'rug' && Math.abs(it.x - a[0]) < 130 && a[1] !== undefined && Math.abs(it.z - a[1]) < 0.09) clash = true;
    });
    if (!clash) return a;
  }
  return opts[0];
}
function hSpots(){
  var out = [
    { id:'window', name:'the window', sub:'the valley, framed', x:1030, z:0.655, act:'gaze' },
    { id:'fire',   name:'the hearth', sub:'warm hands',         x:640,  z:0.70,  act:'warm' },
    { id:'bed',    name:'the bed',    sub:'where the day ends', x:1900, z:0.72,  act:'sleep' }
  ];
  hstate.items.forEach(function(it){
    var d = hDef(it.id);
    if (!d || !d.act) return;
    var sx = it.x, sz = it.z;
    if (d.kind === 'chair'){ sx = it.x; sz = it.z; }
    if (d.kind === 'cat'){ var c = hItem('cat'); sx = c.x; sz = c.z + 0.02; }
    out.push({ id: d.id, name: d.name, sub: d.sub, x: sx, z: sz, act: d.act });
  });
  return out;
}
function hCount(){ document.getElementById('found-n').textContent = hstate.items.length; }
function hPlaceNext(silent, t){
  var remaining = HITEMS_DEF.filter(function(d){ return !hHas(d.id); });
  if (!remaining.length) return null;
  var d = remaining[0];
  var a = hFreeAnchor(d.id);
  var it = { id: d.id, x: a[0], z: a[1] !== undefined ? a[1] : 0.6 };
  hstate.items.push(it);
  hCount();
  if (!silent){
    showToast(d);
    addNote('brought home ' + d.name, 'making it his', 'home', t);
    sayFor(man, d.id === 'cat' ? 'well. hello.' : 'there.', 2200);
    man.hop = 1;
  }
  return it;
}
function hPickActivity(t, dark){
  var spots = hSpots();
  if (dark > 0.62) return spots.filter(function(s){ return s.act === 'sleep'; })[0];
  var weighted = [];
  spots.forEach(function(s){
    var w = 1;
    if (s.act === 'sleep') w = dark > 0.45 ? 2 : 0.15;
    if (s.act === 'warm' || s.act === 'tea') w = dark > 0.3 ? 2 : 1;
    if (s.act === 'read') w = 1.4;
    if (s.act === 'gaze') w = 1.2;
    if (s.act === 'pet') w = 0.7;
    for (var i = 0; i < Math.round(w * 2); i++) weighted.push(s);
  });
  return weighted[Math.floor(Math.random()*weighted.length)];
}
function hWalkTo(x, z, act){
  man.state = 'h-walk'; man.tx = clamp(x, 100, ROOM_W - 100); man.tz = clamp(z, 0.58, 0.76);
  man.hAct = act || null; man.vias = []; man.speed = 82;
}
// ---- input: alpha drives, the house respects it ----
var manualUntil = 0;
var hKeys = {};
function hTap(sx, sy, now){
  if (man.state === 'h-fetch' || man.state === 'h-place') return;   // let him finish carrying
  manualUntil = now + 20000;
  var wx = clamp((sx - W/2) / zoom + W/2 + camX, 100, ROOM_W - 100);
  var gyT = (sy - zcy) / zoom + zcy;
  var wz = clamp((gyT - horizonY) / (meadowH * 0.92), 0.58, 0.76);
  if (man.state === 'h-sleep'){ hWake(now); }
  var spots = hSpots(), hit = null;
  spots.forEach(function(s){ if (Math.abs(s.x - wx) < 120 && Math.abs(s.z - wz) < 0.13) hit = s; });
  if (hit) hWalkTo(hit.x, hit.z, hit);
  else hWalkTo(wx, wz, null);
}
function hWake(now){
  if (man.state !== 'h-sleep') return;
  man.state = 'h-idle'; hstate.idleT = 0; man.stretchT = 1.6;
  sayFor(man, 'mm.', 1200);
}
// ---- per-frame update ----
function houseUpdate(dt, now, t, dark){
  // arrivals + rearranging run on the world's own clock
  if (hstate.next > 0 && worldAge >= hstate.next && man.state !== 'h-fetch' && man.state !== 'h-place' && man.state !== 'h-sleep' && hstate.items.length < HITEMS_DEF.length){
    hstate.next = -hstate.next;   // hold until the fetch below finishes
    man.state = 'h-fetch'; hstate.fetchT = 0; hstate.carry = HITEMS_DEF.filter(function(d){ return !hHas(d.id); })[0];
    hWalkTo(0, 0, null); man.state = 'h-fetch'; man.tx = 210; man.tz = 0.70; man.speed = 88;
  }
  if (hstate.rearr > 0 && worldAge >= hstate.rearr && hstate.items.length >= 4 && man.state === 'h-idle' && hstate.idleT > 2){

function houseFrame(now, dt, t, pal, dark, wind){
  houseUpdate(dt, now, t, dark);
  g.save();
  g.translate(zcx, zcy); g.scale(zoom, zoom); g.translate(-zcx, -zcy);
  drawHouse(now, dt, t, pal, dark, wind);
  g.restore();
  var bbm = bubs[man.id];
  if (bbm){
    bbm.el.style.left = ((man.x - camX - zcx) * zoom + zcx) + 'px';
    bbm.el.style.top = ((gy(man.z) - zcy) * zoom + zcy - 96 * zs(man.z) * zoom) + 'px';
  }
  if (DEBUG){
    window.__zoom = function(z2){ targetZoom = clamp(z2 || 1, ZMIN, ZMAX); return targetZoom; };
    window.__zget = function(){ return { zoom: +zoom.toFixed(3), targetZoom: targetZoom, camX: Math.round(camX), manX: Math.round(man.x), W: W, H: H }; };
    window.__hstate = function(){ return man.state + ' @' + Math.round(man.x) + ',' + man.z.toFixed(2) + ' items=[' + hstate.items.map(function(i){ return i.id; }).join(',') + '] next=' + Math.round(Math.abs(hstate.next) - worldAge) + 's'; };
    window.__hnext = function(){ hstate.next = worldAge; return 'arriving'; };
    window.__htap = function(x2, z2){ manualUntil = performance.now() + 20000; hWalkTo(x2 || 1000, z2 || 0.7, null); };
    window.__hact = function(id){ var s = hSpots().filter(function(k){ return k.id === id; })[0]; if (s) hWalkTo(s.x, s.z, s); return s ? s.act : 'no spot'; };
    window.__hgive = function(n){ n = n || 1; for (var i = 0; i < n; i++) hPlaceNext(false, currentT); return hstate.items.length; };
    window.__hrearr = function(){ hstate.rearr = worldAge; return 'due'; };
  }
  window.__dbg = DEBUG ? ('house | ' + man.state + ' @' + Math.round(man.x) + ' items=' + hstate.items.length + ' t=' + t.toFixed(2)) : '';
  requestAnimationFrame(frame);
}
if (HOUSE_MODE){
  var tapStart = null, tapTimer = null;
  canvas.addEventListener('pointerdown', function(e){ tapStart = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener('pointerup', function(e){
    if (!tapStart) return;
    var moved = Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y);
    var held = performance.now() - tapStart.t;
    tapStart = null;
    if (moved > 12 || held > 500) return;
    var cx2 = e.clientX, cy2 = e.clientY;
    var doTap = function(){ hTap(cx2, cy2, performance.now()); };
    if (zoom > 1.03){ clearTimeout(tapTimer); tapTimer = setTimeout(doTap, 290); }
    else doTap();
  });
  canvas.addEventListener('dblclick', function(){ clearTimeout(tapTimer); targetZoom = 1; });
  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') hKeys.left = true;
    else if (k === 'arrowright' || k === 'd') hKeys.right = true;
    else if (k === 'arrowup' || k === 'w') hKeys.up = true;
    else if (k === 'arrowdown' || k === 's') hKeys.down = true;
    else return;
    e.preventDefault();
  });
  window.addEventListener('keyup', function(e){
    var k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') hKeys.left = false;
    if (k === 'arrowright' || k === 'd') hKeys.right = false;
    if (k === 'arrowup' || k === 'w') hKeys.up = false;
    if (k === 'arrowdown' || k === 's') hKeys.down = false;
  });
}

function pickTarget(c){
  var un = PLACES.filter(function(p){ return !p.found; });
  if (!un.length) un = PLACES;   // all found - revisit favorites
  if (un.length && Math.random() < 0.52){
    var p = un[Math.floor(Math.random()*un.length)];
    if (p.id === 'dock') return { x: DOCK.bx, z: DOCK.bz, place: p, vias: [ { x: DOCK.approach.x, z: DOCK.approach.z }, { x: DOCK.ax, z: DOCK.az } ] };
    return { x: p.x + (Math.random()-0.5)*30, z: clamp(p.z + 0.06 + Math.random()*0.1, 0.18, 0.9), place: p };
  }
  // social gravity - drift toward someone now and then; they drift toward alpha's character most
  if (Math.random() < 0.30){
    var o = null;
    if (c === man){
      var others = chars.filter(function(k){ return k !== c && k.state !== 'meet'; });
      if (others.length && Math.random() < 0.75) o = others[Math.floor(Math.random()*others.length)];
    } else o = man;
    if (o){
      var gx = clamp(o.x + (Math.random()-0.5)*150, 120, WORLD_W-120);
      var gz = clamp(o.z + (Math.random()-0.5)*0.12, 0.2, 0.88);
      if (pondD2(gx, gz) > 1.7 && Math.abs(gx - c.x) > 120) return { x: gx, z: gz };
    }
  }
  for (var i=0;i<14;i++){
    var t = { x: 120 + Math.random()*(WORLD_W-240), z: 0.2 + Math.random()*0.68 };
    var d = Math.abs(t.x - c.x);
    if (d > 350 && d < 1400 && pondD2(t.x, t.z) > 1.7) return t;
  }
  var fx = clamp(c.x + (Math.random()<0.5?-1:1)*500, 120, WORLD_W-120);
  var fz = 0.3+Math.random()*0.5;
  if (pondD2(fx, fz) < 1.7) fz = POND.z + POND.rz * 2.2;
  return { x: fx, z: fz };
}

function newLeg(c){
  c.state = 'stroll';
  // crew members always head back to the site, whatever interrupted them
  if (c.buildRole && build.active && c.buildSpot){
    c.tx = c.buildSpot.x; c.tz = c.buildSpot.z; c.vias = []; c.place = null; c.speed = 78;
    return;
  }
  // stock run - surplus goods go to the market stall
  if (stallDone() && Math.random() < 0.3 && hasSurplus(c)){
    c.stockRun = true;
    c.tx = 2400 + (Math.random()-0.5)*30; c.tz = 0.58 + Math.random()*0.05;
    c.vias = []; c.place = null; c.speed = 60 + Math.random()*20;
    return;
  }
  // a work leg - go labor somewhere you can be watched
  if (Math.random() < 0.28){
    var wt = pickWorkType(c);
    if (wt){
      var tgt = workTarget(c, wt);
      c.workLeg = wt;
      c.tx = tgt.x; c.tz = tgt.z; c.vias = tgt.vias || []; c.place = null;
      c.speed = 58 + Math.random()*26;
      return;
    }
  }
  var t = pickTarget(c);
  c.speed = 54 + Math.random()*30;
  c.tx = t.x; c.tz = t.z; c.place = t.place || null; c.vias = t.vias || [];
  if (pondD2(c.x, c.z) < 1.3 && !(c.place && c.place.id === 'dock')){
    // leaving the dock: walk back along the planks to shore first
    c.vias = [ { x: DOCK.ax, z: DOCK.az }, { x: DOCK.approach.x, z: DOCK.approach.z } ].concat(c.vias);
  }
}

// ---- the zoom lens: wheel / trackpad / pinch, double-tap resets ----
var pinch0 = 0, pinchZoom = 1, iosGesture = false;
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  var d = e.ctrlKey ? e.deltaY * 0.008 : e.deltaY * 0.0012;   // ctrl+wheel = trackpad pinch
  targetZoom = clamp(targetZoom * (1 - d), ZMIN, ZMAX);
}, { passive: false });
canvas.addEventListener('touchstart', function(e){
  if (e.touches.length === 2 && !iosGesture){
    e.preventDefault();
    pinch0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    pinchZoom = targetZoom;
  }
}, { passive: false });
canvas.addEventListener('touchmove', function(e){
  if (e.touches.length === 2 && pinch0 > 0 && !iosGesture){
    e.preventDefault();
    var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    targetZoom = clamp(pinchZoom * d / pinch0, ZMIN, ZMAX);
  }
}, { passive: false });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); iosGesture = true; pinchZoom = targetZoom; }, { passive: false });
document.addEventListener('gesturechange', function(e){ e.preventDefault(); targetZoom = clamp(pinchZoom * e.scale, ZMIN, ZMAX); }, { passive: false });
document.addEventListener('gestureend', function(e){ e.preventDefault(); }, { passive: false });
canvas.addEventListener('dblclick', function(){ targetZoom = 1; });
var lastTap = 0;
canvas.addEventListener('touchend', function(e){
  if (e.touches.length === 0 && e.changedTouches.length === 1){
    var now2 = performance.now();
    if (now2 - lastTap < 300) targetZoom = 1;
    lastTap = now2;
  }
});
function dayWord(t){
  if (t < 0.22 || t >= 0.9) return 'deep night';
  if (t < 0.30) return 'dawn';
  if (t < 0.45) return 'morning';
  if (t < 0.68) return 'afternoon';
  if (t < 0.76) return 'golden hour';
  if (t < 0.86) return 'dusk';
  return 'night';
}

// ---------- drawing ----------
function ridge(parallax, baseY, amp, seed, color){
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(-4, H);
  for (var sx = -4; sx <= W+24; sx += 24){
    var wx = (sx + camX * parallax) * 0.0035 + seed;
    var n = Math.sin(wx*1.7+seed)*0.55 + Math.sin(wx*3.9+seed*2)*0.3 + Math.sin(wx*8.3+seed*3)*0.15;
    g.lineTo(sx, baseY - (n*0.5+0.5)*amp);
  }
  g.lineTo(W+24, H);
  g.closePath();
  g.fill();
}

function drawTree(gx, gy2, s, color, sway){
  // trunk
  g.strokeStyle = 'rgba(74,56,42,0.9)';
  g.lineWidth = 5*s; g.lineCap = 'round';
  g.beginPath(); g.moveTo(gx, gy2); g.quadraticCurveTo(gx + sway*2*s, gy2 - 26*s, gx + sway*4*s, gy2 - 44*s); g.stroke();
  // canopy blobs
  g.fillStyle = color;
  var cx = gx + sway*4*s, cy = gy2 - 44*s;
  [[0,0,27],[-23,10,18],[23,9,19],[-10,-16,18],[13,-14,16],[-30,2,13],[30,1,14]].forEach(function(b){
    g.beginPath(); g.arc(cx + b[0]*s, cy + b[1]*s, b[2]*s, 0, 6.29); g.fill();
  });
}

function drawMan(x, y, s, face, step, mode, running, squash, stretch, tip, look, hat, wave){
  squash = squash || 1; stretch = stretch || 0; tip = tip || 0; wave = wave || 0;
  look = look || { body:'#c96f4a', sleeve:'#b45f3d', skin:'#8a5a3b', hair:'#2e2119', band:'#d9a441' };
  hat = hat || 'straw';
  g.save();
  g.translate(x, y);
  // shadow
  g.fillStyle = 'rgba(40,32,24,0.20)';
  g.beginPath(); g.ellipse(0, 0, 13*s, 4*s, 0, 0, 6.29); g.fill();
  var bob = (mode==='walk') ? -Math.abs(Math.sin(step))*2.2*s : (mode==='idle' ? -Math.sin(step*0.4)*0.8*s : 0);
  var sit = (mode==='sit');
  g.translate(0, bob + (sit ? 8*s : 0));
  g.scale(face*s*(2-squash), s*squash);
  var swing = (mode==='walk') ? Math.sin(step)*(running?0.62:0.42) : 0;
  // legs
  g.lineCap = 'round';
  g.lineWidth = 4.6;
  if (sit){
    g.strokeStyle = '#5b4a3d';
    g.beginPath(); g.moveTo(-3, -16); g.lineTo(8, -14); g.lineTo(10, -4); g.stroke();
    g.strokeStyle = '#4e3f34';
    g.beginPath(); g.moveTo(-1, -15); g.lineTo(11, -13); g.lineTo(13, -3); g.stroke();
  } else {
    g.strokeStyle = '#5b4a3d';
    g.beginPath(); g.moveTo(-1, -26); g.lineTo(Math.sin(swing)*10, -26 + 24 - Math.abs(Math.cos(swing))*2); g.stroke();
    g.strokeStyle = '#4e3f34';
    g.beginPath(); g.moveTo(1, -26); g.lineTo(Math.sin(-swing)*10, -26 + 24 - Math.abs(Math.cos(swing))*2); g.stroke();
  }
  // body
  g.fillStyle = look.body;
  roundRect(-9.5, -46, 19, 22, 8); g.fill();
  // arms
  g.lineWidth = 4.2; g.strokeStyle = look.sleeve;
  if (!sit){
    var lax = -7 + Math.sin(-swing)*8*0.8, lay = -42 + 11;
    var rax = 7 + Math.sin(swing)*8*0.8, ray = -42 + 11;
    if (mode === 'work'){
      var hw = Math.sin(step*2);
      lax = 6 + hw*5; lay = -34 + Math.abs(hw)*3;
      rax = 12 - hw*3; ray = -30 - hw*6;
    }
    if (mode === 'forage'){
      var pk = Math.sin(step*2);
      lax = 2 + pk*4; lay = -14 + Math.abs(pk)*2;
      rax = 8 - pk*3; ray = -16 - pk*3;
    }
    if (stretch > 0){
      lax = lax + (-13 - lax) * stretch; lay = lay + (-58 - lay) * stretch;
      rax = rax + (13 - rax) * stretch;  ray = ray + (-58 - ray) * stretch;
    }
    if (tip > 0){ rax = rax + (6 - rax) * tip; ray = ray + (-63 - ray) * tip; }
    if (wave > 0){
      var wx2 = 14 + Math.sin(time*13)*2.5*wave, wy2 = -58;
      rax = rax + (wx2 - rax) * wave; ray = ray + (wy2 - ray) * wave;
    }
    g.beginPath(); g.moveTo(-7, -42); g.lineTo(lax, lay); g.stroke();
    g.beginPath(); g.moveTo(7, -42); g.lineTo(rax, ray); g.stroke();
  } else {
    var slx = -4 + (-12 + 4) * stretch, sly = -32 + (-54 + 32) * stretch;
    var srx = 10 + (12 - 10) * stretch,  sry = -32 + (-54 + 32) * stretch;
    g.beginPath(); g.moveTo(-7, -40); g.lineTo(slx, sly); g.stroke();
    g.beginPath(); g.moveTo(7, -40); g.lineTo(srx, sry); g.stroke();
  }
  // head
  g.fillStyle = look.skin;
  g.beginPath(); g.arc(2, -55, 9.5, 0, 6.29); g.fill();

    if (Math.random() < dt * 0.09){
      var goodKind = c.laborType === 'forage' ? 'berries' : c.laborType;
      c.goods[goodKind] = (c.goods[goodKind] || 0) + 1;
      saveGoods();
      goodsPops.push({ x: c.x, z: c.z, kind: goodKind, t: 0 });
      if (c.laborType === 'fish') ripples.push({ r: 6, a: 0.6, x: -100 + Math.random()*50, y: 8 + Math.random()*8 });
      if (Math.random() < 0.3) sayFor(c, CATCH_LINES[c.laborType][Math.floor(Math.random()*CATCH_LINES[c.laborType].length)], 1800);
    }
    if (c.laborT <= 0){ c.state = 'pause'; c.pauseUntil = now + 400; }
  } else if (c.state === 'build'){
    c.workT = (c.workT || 0) + dt;
  } else if (c.state === 'meet'){
    var o = c.meetWith;
    if (!o || o.state !== 'meet'){ endMeet(c, now); return; }
    c.meetT += dt;
    if (c.meetSpot){
      var msp = c.meetSpot, mk2 = Math.min(1, dt * 5);
      c.x += (msp.x - c.x) * mk2; c.z += (msp.z - c.z) * mk2;
      if (Math.abs(msp.x - c.x) < 2 && Math.abs(msp.z - c.z) < 0.01) c.meetSpot = null;
    }
    if (c.meetT > 1.5 && c.beat < 1){
      c.beat = 1;
      if (!c.meetLead) sayFor(c, c.smalltalk[Math.floor(Math.random()*c.smalltalk.length)], 2500);
    }
    if (c.meetT > 3.2 && c.beat < 2){
      c.beat = 2;
      if (c.meetLead){
        sayFor(c, CHAT[Math.floor(Math.random()*CHAT.length)], 2400);
        resolveExchange(c, o, now, t);
        resolveTrade(c, o, now);
      }
    }
    if (c.meetT > 5.2 && c.beat < 3){
      c.beat = 3;
      c.waveT = 1.4;
      if (!c.meetLead && Math.random() < 0.7) sayFor(c, PARTS[Math.floor(Math.random()*PARTS.length)], 1900);
    }
    if (c.meetT > 6.4) endMeet(c, now);
  } else if (c.state === 'pause' || c.state === 'sit'){
    if (now >= c.pauseUntil){
      if (c.state === 'pause' && c.resume){
        c.tx = c.resume.tx; c.tz = c.resume.tz; c.place = c.resume.place;
        c.vias = c.resume.vias; c.speed = c.resume.speed; c.resume = null;
        c.state = 'stroll';
      } else newLeg(c);
    }
  } else {
    if (c.vias.length){
      var v0 = c.vias[0];
      if (Math.hypot(v0.x - c.x, (v0.z - c.z) * 900) < 24) c.vias.shift();
    }
    var aimX = c.vias.length ? c.vias[0].x : c.tx;
    var aimZ = c.vias.length ? c.vias[0].z : c.tz;
    var dx = aimX - c.x, dz = aimZ - c.z;
    var dist = Math.hypot(c.tx - c.x, (c.tz - c.z) * 900); // z compressed space
    if (dist < 40 && !c.vias.length && c.buildRole){
      c.state = 'pause'; c.pauseUntil = now + 90000; c.vx = 0; c.vz = 0;  // crew waits at the site
    } else if (dist < ((c.workLeg === 'fish' || (c.place && c.place.id === 'dock')) ? 85 : 26) && !c.vias.length){
      var pool = thoughtPool(t);
      var p = c.place;
      if (c.workLeg){ startLabor(c, now); }
      else if (c.stockRun){ doStock(c); c.state = 'pause'; c.pauseUntil = now + 1400; c.stockRun = false; }
      else if (p && p.sit && Math.random() < (isV ? 0.5 : 0.4)){
        c.state = 'sit';
        c.pauseUntil = now + 7000 + Math.random()*7000;
        if (p.id === 'dock'){ c.x = p.x; c.z = p.z; c.face = 1; c.lastFace = 1; c.visFace = 1; }
        else { c.x = p.x + 52; c.z = p.z + 0.10; c.face = -1; c.lastFace = -1; c.visFace = -1; } // settle beside it, not on top of it
        if (isV || Math.random() < 0.35) sayFor(c, p.id === 'fire' ? 'warm.' : p.sub + '.', 3200);
      } else {
        c.state = 'pause';
        c.pauseUntil = now + 2400 + Math.random()*4200;
        if (Math.random() < 0.5){
          sayFor(c, p && Math.random() < 0.4 ? p.sub + '.' : (isV ? pool : c.smalltalk)[Math.floor(Math.random()*(isV ? pool : c.smalltalk).length)], 3000);
        }
      }
      c.place = null;
    } else {
      var desired = Math.atan2(dx, dz*900);
      // curve around the pond instead of wading through it
      var pd = pondD2(c.x + c.vx*0.6, c.z + c.vz*0.6*4);
      if (pd < 2.1 && !c.vias.length && !(c.place && c.place.id === 'dock')){
        var ex = (c.x - POND.x)/POND.rx, ez = (c.z - POND.z)/POND.rz;
        var tAng = Math.atan2(-ez, ex);              // tangent around the ellipse
        var tAng2 = tAng + Math.PI;                  // other direction
        var d1 = Math.abs(((desired - tAng + Math.PI*3) % (2*Math.PI)) - Math.PI);
        var d2 = Math.abs(((desired - tAng2 + Math.PI*3) % (2*Math.PI)) - Math.PI);
        var best = d1 < d2 ? tAng : tAng2;
        var w = clamp((2.1 - pd) / 1.1, 0, 1);       // stronger the closer they get
        var dd = ((best - desired + Math.PI*3) % (2*Math.PI)) - Math.PI;
        desired += dd * w;
      }
      var dh = desired - c.heading;
      while (dh > Math.PI) dh -= 2*Math.PI; while (dh < -Math.PI) dh += 2*Math.PI;
      var maxTurn = 1.9 * dt;
      c.heading += clamp(dh, -maxTurn, maxTurn);
      var approach = clamp(dist / 140, 0.3, 1);  // ease into stops
      var target = c.speed * approach * Math.max(0.4, Math.cos(dh));
      var k = 1 - Math.exp(-dt / 0.35);
      c.vx += (Math.sin(c.heading)*target - c.vx) * k;
      c.vz += (Math.cos(c.heading)*target/900 - c.vz) * k;
      c.x = clamp(c.x + c.vx * dt, 90, WORLD_W - 90);
      c.z = clamp(c.z + c.vz * dt, 0.16, 0.9);
      // never actually in the water
      var pd2v = pondD2(c.x, c.z);
      if (pd2v < 1.0){
        var k2 = 1 / Math.sqrt(pd2v);
        c.x = POND.x + (c.x - POND.x) * k2;
        c.z = POND.z + (c.z - POND.z) * k2;
      }
      c.step += c.spd * dt * 0.075;
      if (Math.abs(c.vx) > 4) c.face = c.vx > 0 ? 1 : -1;
      // discoveries - alpha's character does the finding
      if (isV){
        PLACES.forEach(function(p2){
          if (!p2.found && Math.abs(c.x - p2.x) < p2.r && Math.abs(c.z - p2.z) < 0.22){
            p2.found = true; found++;
            document.getElementById('found-n').textContent = found;
            showToast(p2);
            c.hop = 1;          // little jump of joy
            c.tipT = 1.3;       // and a tip of the hat
            if (p2.id !== 'dock'){   // on the dock he keeps walking to the end
              c.resume = { tx: c.tx, tz: c.tz, place: c.place, vias: c.vias, speed: c.speed };
              c.state = 'pause';
              c.pauseUntil = now + 5000;
              c.tx = c.x; c.tz = c.z;
              c.vx = 0; c.vz = 0;
            }
          }
        });
      }
    }
  }
  if (c.state !== 'stroll'){ c.vx *= Math.exp(-dt*4); c.vz *= Math.exp(-dt*4); }
  if (c.hop > 0) c.hop = Math.max(0, c.hop - dt*2.4);
  if (c.face !== c.lastFace){ c.turnT = 0.15; c.lastFace = c.face; c.visFace = c.face; }
  var squash = 1;
  if (c.turnT > 0){ c.turnT -= dt; squash = 1 - 0.16*Math.sin(Math.PI*Math.max(0, c.turnT)/0.15); }
  c.squash = squash;
  c.mode = c.state === 'sit' ? 'sit' : (c.state === 'build' ? 'work' : (c.state === 'labor' ? (c.laborType === 'fish' ? 'fishsit' : (c.laborType === 'forage' ? 'forage' : 'work')) : (c.spd > 6 ? 'walk' : 'idle')));
  if (c.mode === 'idle') c.step += dt * 2;
  else if (c.mode === 'work') c.step += dt * 7;
  else if (c.mode === 'forage') c.step += dt * 5;
  else if (c.mode === 'fishsit') c.step += dt * 1.5;
  if (c.mode === 'idle' || c.mode === 'sit'){ c.idleT += dt; if (c.idleT > 3.5 && c.stretchT <= 0 && c.state !== 'meet') c.stretchT = 1.6; }
  else c.idleT = 0;
  if (c.stretchT > 0) c.stretchT = Math.max(0, c.stretchT - dt);
  if (c.tipT > 0) c.tipT = Math.max(0, c.tipT - dt);
  c.tipAmt = c.tipT > 0 ? Math.sin(Math.PI * clamp((1.3 - c.tipT) / 1.3, 0, 1)) : 0;
  if (c.waveT > 0) c.waveT = Math.max(0, c.waveT - dt);
  c.waveAmt = c.waveT > 0 ? Math.sin(Math.PI * clamp((1.4 - c.waveT) / 1.4, 0, 1)) : 0;
  c.stretchAmt = c.stretchT > 0 ? Math.sin(Math.PI * clamp((1.6 - c.stretchT) / 1.6, 0, 1)) : 0;
  if (c.bubAfter && now >= c.bubAfter.at){ sayFor(c, c.bubAfter.text, 2600); c.bubAfter = null; }
  if (c === man && c.notePending && c.state !== 'meet'){
    addNote(c.notePending.text, c.notePending.why, c.notePending.place, c.notePending.t);
    sayFor(man, 'alpha should hear this.', 2800);
    c.notePending = null;
  }
}

// ---------- main loop ----------
var time = 0, last = performance.now();

function frame(now){
  var dt = Math.min((now - last)/1000, 0.05);
  last = now;
  time += dt;
  worldAge += dt;
  worldSaveT += dt;
  if (worldSaveT > 15){ worldSaveT = 0; saveWorld(); }
  var t = ((T0 + time / DAY_LEN) % 1 + 1) % 1;
  currentT = t;
  var pal = palAt(t);
  var dark = pal.darkRaw;
  var wind = Math.sin(time * 0.23) * 0.5 + 0.5;
  // the lens eases toward alpha's setting - gentle, never a fight with the camera
  zoom += (targetZoom - zoom) * Math.min(1, dt * 9);
  if (Math.abs(targetZoom - zoom) < 0.002) zoom = targetZoom;
  if (!zcy) zcy = H * 0.55;
  // at 1x the composition is fixed; the closer the lens, the more it holds the followed one
  var trackK = clamp((zoom - 1) / (ZMAX - 1), 0, 1);
  var zcyT = H * 0.55 + trackK * (gy(man.z) - 125 * zs(man.z) - H * 0.55);
  zcy += (zcyT - zcy) * Math.min(1, dt * 2);
  zcx = W * 0.5;
  bgX = zcx - zcx / zoom; bgY = zcy - zcy / zoom; bgW = W / zoom; bgH = H / zoom;

  if (HOUSE_MODE){ houseFrame(now, dt, t, pal, dark, wind); return; }

  // ---- encounters - two characters near each other stop and talk ----
  for (var pi5 = 0; pi5 < chars.length; pi5++){
    for (var pj5 = pi5 + 1; pj5 < chars.length; pj5++){
      var A = chars[pi5], B = chars[pj5];
      if (A.state === 'meet' || B.state === 'meet' || A.state === 'build' || B.state === 'build') continue;
      if (A.buildRole || B.buildRole) continue;
      if (A.state === 'sit' && B.state === 'sit') continue;
      if ((pairCd[pairKey(A, B)] || 0) > now) continue;
      if (now - lastMeet < 9000) continue;
      if (pondD2(A.x, A.z) < 1.35 || pondD2(B.x, B.z) < 1.35) continue;
      if (Math.abs(A.x - B.x) < 90 && Math.abs(A.z - B.z) < 0.075){
        lastMeet = now; meetCount++;
        startMeet(A, B, now, t);
      }
    }
  }

  // ---- characters ----
  chars.forEach(function(c){ updateChar(c, dt, now, t); });

  // paths wear in where feet actually go
  heatT += dt;
  if (heatT > 2){
    heatT = 0;
    chars.forEach(function(c){
      if (c.spd > 10){
        var bx2 = clamp(Math.floor(c.x / 50), 0, HEAT_W - 1);
        var bz2 = clamp(Math.floor((c.z - 0.15) / 0.1), 0, HEAT_H - 1);
        var hidx = bz2 * HEAT_W + bx2;
        if (heat[hidx] < 240) heat[hidx]++;
      }
    });
  }

  // ---- building projects - the crew gathers, works, and the world keeps what they make ----
  if (!build.active && worldAge > build.nextAt){
    var remaining = PROJECTS.filter(function(pj){ return !pj.done; });
    if (remaining.length){
      var proj = forcedProject || remaining[0];
      var wasForced = !!forcedProject;
      forcedProject = null;
      if (!wasForced && !civReady(proj)){
        build.nextAt = worldAge + 90;
        if (!proj._noted){
          proj._noted = true;
          addNote('the camp is gathering ' + (proj.cost ? Object.keys(proj.cost)[0] : 'goods') + ' for ' + proj.name + '.', 'civilization', 'the valley', currentT);
        }
      }
      else {
      var others = chars.filter(function(c2){ return c2 !== man && c2.state !== 'meet' && c2.state !== 'build' && !c2.buildRole; })
        .sort(function(a2, b2){ return Math.abs(a2.x - proj.x) - Math.abs(b2.x - proj.x); });
      // alpha's character joins when he is close enough to wander over - otherwise the camp manages without him
      var crew = (Math.abs(man.x - proj.x) < 800 && man.state !== 'meet')
        ? [man].concat(others.slice(0, 2))
        : others.slice(0, 3);
      build.active = { proj: proj, crew: crew, stage: 'gather', t: 0 };
      crew.forEach(function(c2){
        c2.buildRole = true;
        c2.state = 'stroll'; c2.resume = null; c2.meetWith = null; c2.place = null;
        var ang = Math.random()*6.28;
        c2.tx = proj.x + Math.cos(ang)*48;
        c2.tz = clamp(proj.z + Math.sin(ang)*0.05, 0.2, 0.88);
        c2.vias = []; c2.speed = 74 + Math.random()*18;
        c2.buildSpot = { x: c2.tx, z: c2.tz };
      });
      }
    } else build.nextAt = worldAge + 600;
  }
  if (build.active){
    var B = build.active;
    if (B.stage === 'gather'){
      B.t += dt;
      var arrived = B.crew.every(function(c2){ return Math.hypot(c2.x - c2.buildSpot.x, (c2.z - c2.buildSpot.z) * 900) < 56; });
      if (arrived){
        B.stage = 'work'; B.t = 0;
        B.crew.forEach(function(c2){
          c2.state = 'build'; c2.workT = 0; c2.vx = 0; c2.vz = 0;
          c2.face = c2.x < B.proj.x ? 1 : -1; c2.lastFace = c2.face; c2.visFace = c2.face; c2.idleT = 0;
        });
        sayFor(B.crew[Math.floor(Math.random()*B.crew.length)], 'let us build ' + B.proj.name + '.', 2600);
      } else if (B.t > 75){
        B.crew.forEach(function(c2){ c2.buildRole = false; c2.pauseUntil = Math.min(c2.pauseUntil, now + 400); });
        build.active = null; build.nextAt = worldAge + 120;
      }
    } else if (B.stage === 'work'){
      B.t += dt;
      if (Math.random() < 0.35) buildParts.push({ x: B.proj.x + (Math.random()-0.5)*44, z: B.proj.z, y: 0, vy: -(8+Math.random()*12), life: 0.4+Math.random()*0.4, s: 1.5+Math.random()*2 });
      if (B.t > 14){
        B.proj.done = true;
        payCost(B.proj);
        saveBuilt();
        dustPoof(B.proj);
        B.crew.forEach(function(c2){ c2.state = 'pause'; c2.pauseUntil = now + 1800; c2.hop = 1; c2.buildRole = false; c2.idleT = 0; });
        sayFor(B.crew[0], B.proj.cost ? 'the valley grows.' : 'looks right.', 2400);
        build.active = null;
        build.nextAt = worldAge + (B.proj.cost ? 720 + Math.random()*360 : 240 + Math.random()*180);
        saveWorld();
      }
    }
  }
  buildParts.forEach(function(bp){ bp.y += bp.vy*dt; bp.x += Math.sin(time*5 + bp.y*0.3)*6*dt; bp.life -= dt; });
  buildParts = buildParts.filter(function(bp){ return bp.life > 0; });
  tradeFly.forEach(function(tf){ tf.t += dt * 1.1; });
  tradeFly = tradeFly.filter(function(tf){ return tf.t < 1; });
  goodsPops.forEach(function(gp2){ gp2.t += dt; });
  goodsPops = goodsPops.filter(function(gp2){ return gp2.t < 1.2; });

  // camera - his character first, but frame the interesting thing when it is near
  var focusX = man.x, interestX = null;
  if (build.active && build.active.stage === 'work' && man.state !== 'build' && man.state !== 'meet') interestX = build.active.proj.x;
  else if (lastMeetInfo && lastMeetInfo.until > now && lastMeetInfo.a !== man && lastMeetInfo.b !== man && man.state === 'stroll') interestX = lastMeetInfo.x;
  else {
    for (var li = 0; li < chars.length; li++){
      if (chars[li] !== man && chars[li].state === 'labor' && man.state === 'stroll'){ interestX = chars[li].x; break; }
    }
  }
  if (interestX !== null && Math.abs(interestX - man.x) < 1100 / Math.max(1, zoom)) focusX = (man.x + interestX) / 2;
  var camTarget = clamp(focusX - W*0.5, W/(2*zoom) - W/2, WORLD_W - W/2 - W/(2*zoom));
  camX += (camTarget - camX) * (1 - Math.exp(-dt*2.4));

  // ---- creatures ----
  // birds
  birds.t -= dt;
  if (birds.t <= 0 && dark < 0.6){
    birds.t = 16 + Math.random()*22;
    var dir = Math.random() < 0.5 ? 1 : -1;
    birds.flock = { x: dir > 0 ? camX - 300 : camX + W + 300, y: 40 + Math.random()*horizonY*0.5, dir: dir, n: 3 + Math.floor(Math.random()*3), ph: 0 };
  }
  if (birds.flock){
    birds.flock.x += birds.flock.dir * 55 * dt;
    birds.flock.ph += dt * 7;
    if (birds.flock.x < camX - 500 || birds.flock.x > camX + W + 500) birds.flock = null;
  }
  // deer
  if (!deer.active){
    deer.t -= dt;
    if (deer.t <= 0){
      deer.active = true; deer.state = 'stand'; deer.timer = 5 + Math.random()*5;
      deer.x = camX + W * (0.2 + Math.random()*0.6);
      deer.dir = Math.random() < 0.5 ? 1 : -1;
    }
  } else {
    deer.timer -= dt;
    if (deer.state === 'stand' && deer.timer <= 0){ deer.state = 'walk'; deer.timer = 6 + Math.random()*6; }
    else if (deer.state === 'walk'){
      deer.x += deer.dir * 22 * dt;
      if (deer.timer <= 0){ deer.active = false; deer.t = 90 + Math.random()*150; }
    }
  }
  // shooting star
  if (!shoot.active && dark > 0.8){
    shoot.t -= dt;
    if (shoot.t <= 0){ shoot.active = true; shoot.x = Math.random()*W*0.8; shoot.y = 20 + Math.random()*60; shoot.vx = 320 + Math.random()*160; shoot.life = 0.8; }
  }
  if (shoot.active){ shoot.x += shoot.vx*dt; shoot.y += shoot.vx*0.35*dt; shoot.life -= dt; if (shoot.life <= 0){ shoot.active = false; shoot.t = 25 + Math.random()*50; } }
  // rain - passes through on slow timescales
  rain.t -= dt;
  if (rain.t <= 0){
    rain.active = !rain.active;
    rain.t = rain.active ? 40 + Math.random()*70 : 150 + Math.random()*200;
    if (rain.active && dark < 0.5 && man.state !== 'stroll') say('rain.', 2400);
  }
  rain.a += ((rain.active ? 1 : 0) - rain.a) * (1 - Math.exp(-dt*0.4));
  // owl - rare silent glide, only deep night
  if (!owl.active && dark > 0.75){
    owl.t -= dt;
    if (owl.t <= 0){
      owl.active = true; owl.dir = Math.random() < 0.5 ? 1 : -1;
      owl.x = owl.dir > 0 ? -90 : W + 90; owl.y = 60 + Math.random()*horizonY*0.5; owl.ph = 0;
    }
  }
  if (owl.active){
    owl.x += owl.dir * 34 * dt; owl.ph += dt * 3.2;
    if (owl.x < -140 || owl.x > W + 140){ owl.active = false; owl.t = 70 + Math.random()*90; }
  }
  // pond ripples
  rippleT -= dt;
  if (rippleT <= 0){ rippleT = rain.a > 0.4 ? 0.18 + Math.random()*0.3 : 2.5 + Math.random()*4; ripples.push({ r: 4, a: 0.5, x: (Math.random()-0.5)*140, y: (Math.random()-0.5)*22 }); }
  ripples.forEach(function(r){ r.r += 26*dt; r.a -= 0.16*dt; });
  ripples = ripples.filter(function(r){ return r.a > 0; });
  // fireflies drift
  fireflies.forEach(function(f){
    f.ph += dt;
    f.x += Math.sin(f.ph*0.7)*14*dt; f.z = clamp(f.z + Math.cos(f.ph*0.5)*0.03*dt, 0.15, 0.9);
  });
  // butterflies (day, near flowers or man)
  butterflies.forEach(function(b, bi){
    b.ph += dt*3;
    if (Math.random() < 0.008){ b.tx = clamp(b.x + (Math.random()-0.5)*400, 100, WORLD_W-100); b.tz = 0.3+Math.random()*0.5; }
    b.x += clamp(b.tx - b.x, -30, 30) * dt * 1.6;
    b.z += clamp(b.tz - b.z, -0.1, 0.1) * dt * 1.6;
  });
  // ducks paddle slow circles on the pond
  ducks.forEach(function(dk){
    dk.a += dk.sp * dt;
    dk.flap += dt * 3;
    if (Math.random() < dt * 0.25){
      ripples.push({ r: 3, a: 0.35, x: Math.cos(dk.a)*dk.r, y: Math.sin(dk.a)*dk.r*0.24 + 6 });
    }
  });
  // campfire particles
  var fireLit = dark > 0.28 || chars.some(function(c){ return c.state==='sit' && Math.abs(c.x-3050)<130; });
  if (fireLit && Math.random() < 0.5) fireParts.push({ x:(Math.random()-0.5)*10, y:0, vy:-(18+Math.random()*22), life:0.6+Math.random()*0.7, s:2+Math.random()*2.5 });
  fireParts.forEach(function(p){ p.y += p.vy*dt; p.x += Math.sin(time*6+p.y*0.2)*8*dt; p.life -= dt; });
  fireParts = fireParts.filter(function(p){ return p.life > 0; });

  // ================= draw =================
  // the zoom lens - magnify the whole scene around the camera's focus
  g.save();
  g.translate(zcx, zcy); g.scale(zoom, zoom); g.translate(-zcx, -zcy);

        }
      } else if (pj.id === 'blanket'){
        g.save(); g.translate(x, y); g.rotate(-0.06);
        g.fillStyle = '#c96f4a';
        roundRect(-30*s, -12*s, 60*s, 20*s, 4*s); g.fill();
        g.fillStyle = 'rgba(255,253,248,0.7)';
        g.fillRect(-30*s, -4*s, 60*s, 4*s);
        g.restore();
        g.fillStyle = '#8a6a4a';
        g.beginPath(); g.ellipse(x + 12*s, y - 15*s, 7*s, 5*s, 0, 0, 6.29); g.fill();
        g.strokeStyle = '#6d5138'; g.lineWidth = 1.6*s;
        g.beginPath(); g.arc(x + 12*s, y - 17*s, 6*s, Math.PI, 0); g.stroke();
      } else if (pj.id === 'stall'){
        g.strokeStyle = '#5d4630'; g.lineWidth = 3.2*s; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x - 34*s, y); g.lineTo(x - 34*s, y - 44*s); g.stroke();
        g.beginPath(); g.moveTo(x + 34*s, y); g.lineTo(x + 34*s, y - 44*s); g.stroke();
        g.fillStyle = '#c96f4a';
        g.beginPath(); g.moveTo(x - 42*s, y - 44*s); g.lineTo(x + 42*s, y - 44*s); g.lineTo(x + 34*s, y - 56*s); g.lineTo(x - 34*s, y - 56*s); g.closePath(); g.fill();
        g.fillStyle = 'rgba(255,253,248,0.75)';
        for (var sti = -1; sti <= 1; sti++){
          g.beginPath(); g.moveTo(x + sti*28*s - 6*s, y - 44*s); g.lineTo(x + sti*28*s + 6*s, y - 44*s); g.lineTo(x + sti*28*s + 2*s, y - 56*s); g.lineTo(x + sti*28*s - 14*s, y - 56*s); g.closePath(); g.fill();
        }
        g.fillStyle = '#8a6a4a';
        roundRect(x - 38*s, y - 18*s, 76*s, 6*s, 2*s); g.fill();
        var si2 = 0;
        ['fish','berries','wood','craft'].forEach(function(k3){
          var n2 = Math.min(stallStock[k3] || 0, 3);
          for (var gi3 = 0; gi3 < n2; gi3++){
            drawGood(k3, x - 27*s + si2 * 18*s, y - 24*s, s * 0.9);
            si2++;
          }
        });
      } else if (pj.id === 'hearth'){
        // a tripod crane over the campfire, kettle hanging - the camp learns to cook
        g.strokeStyle = '#5d4630'; g.lineWidth = 2.6*s; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x - 20*s, y); g.lineTo(x, y - 40*s); g.stroke();
        g.beginPath(); g.moveTo(x + 20*s, y); g.lineTo(x, y - 40*s); g.stroke();
        g.beginPath(); g.moveTo(x, y - 40*s); g.lineTo(x, y - 26*s); g.stroke();
        g.fillStyle = '#4a4038';
        g.beginPath(); g.ellipse(x, y - 22*s, 7*s, 5.5*s, 0, 0, 6.29); g.fill();
        g.strokeStyle = '#4a4038'; g.lineWidth = 1.4*s;
        g.beginPath(); g.arc(x, y - 27*s, 5*s, Math.PI, 0); g.stroke();
      } else if (pj.id === 'hut'){
        // the first roof - a little a-frame, window warm at night
        g.fillStyle = '#8a6a4a';
        g.beginPath(); g.moveTo(x - 34*s, y); g.lineTo(x, y - 46*s); g.lineTo(x + 34*s, y); g.closePath(); g.fill();
        g.strokeStyle = '#5d4630'; g.lineWidth = 3*s; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x - 38*s, y); g.lineTo(x, y - 50*s); g.lineTo(x + 38*s, y); g.stroke();
        g.fillStyle = '#4a3a2c';
        roundRect(x - 7*s, y - 18*s, 14*s, 18*s, 2*s); g.fill();
        var night = (t > 0.8 || t < 0.12);
        g.fillStyle = night ? '#f4c76a' : '#e8ddc8';
        roundRect(x + 12*s, y - 26*s, 9*s, 9*s, 1.5*s); g.fill();
        if (night){
          g.fillStyle = 'rgba(244,199,106,0.18)';
          g.beginPath(); g.arc(x + 16*s, y - 22*s, 16*s, 0, 6.29); g.fill();
        }
      } else if (pj.id === 'well'){
        g.fillStyle = '#9a9186';
        g.beginPath(); g.ellipse(x, y - 4*s, 20*s, 8*s, 0, 0, 6.29); g.fill();
        g.fillStyle = '#7d7468';
        g.beginPath(); g.ellipse(x, y - 7*s, 16*s, 6*s, 0, 0, 6.29); g.fill();
        g.fillStyle = '#3a4a52';
        g.beginPath(); g.ellipse(x, y - 7*s, 11*s, 4*s, 0, 0, 6.29); g.fill();
        g.strokeStyle = '#5d4630'; g.lineWidth = 2.6*s; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x - 16*s, y - 6*s); g.lineTo(x - 16*s, y - 34*s); g.stroke();
        g.beginPath(); g.moveTo(x + 16*s, y - 6*s); g.lineTo(x + 16*s, y - 34*s); g.stroke();
        g.fillStyle = '#8a6a4a';
        g.beginPath(); g.moveTo(x - 22*s, y - 34*s); g.lineTo(x, y - 44*s); g.lineTo(x + 22*s, y - 34*s); g.closePath(); g.fill();
        g.strokeStyle = '#6d5138'; g.lineWidth = 1.4*s;
        g.beginPath(); g.moveTo(x, y - 38*s); g.lineTo(x, y - 14*s); g.stroke();
        g.fillStyle = '#8a6a4a';
        roundRect(x - 3.5*s, y - 14*s, 7*s, 6*s, 1*s); g.fill();
      } else if (pj.id === 'stall2'){
        g.strokeStyle = '#5d4630'; g.lineWidth = 3.2*s; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x - 30*s, y); g.lineTo(x - 30*s, y - 40*s); g.stroke();
        g.beginPath(); g.moveTo(x + 30*s, y); g.lineTo(x + 30*s, y - 40*s); g.stroke();
        g.fillStyle = '#7d9b76';
        g.beginPath(); g.moveTo(x - 38*s, y - 40*s); g.lineTo(x + 38*s, y - 40*s); g.lineTo(x + 30*s, y - 51*s); g.lineTo(x - 30*s, y - 51*s); g.closePath(); g.fill();
        g.fillStyle = 'rgba(255,253,248,0.75)';
        for (var stj = -1; stj <= 1; stj++){
          g.beginPath(); g.moveTo(x + stj*24*s - 5*s, y - 40*s); g.lineTo(x + stj*24*s + 5*s, y - 40*s); g.lineTo(x + stj*24*s + 2*s, y - 51*s); g.lineTo(x + stj*24*s - 12*s, y - 51*s); g.closePath(); g.fill();
        }
        g.fillStyle = '#8a6a4a';
        roundRect(x - 34*s, y - 16*s, 68*s, 6*s, 2*s); g.fill();
        var si3 = 0;
        ['craft','berries'].forEach(function(k4){
          var n3 = Math.min(stallStock[k4] || 0, 3);
          for (var gi4 = 0; gi4 < n3; gi4++){ drawGood(k4, x - 20*s + si3 * 18*s, y - 22*s, s * 0.9); si3++; }
        });
      } else if (pj.id === 'signpost'){
        g.strokeStyle = '#5d4630'; g.lineWidth = 3.4*s; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - 40*s); g.stroke();
        g.fillStyle = '#8a6a4a';
        g.beginPath(); g.moveTo(x - 2*s, y - 36*s); g.lineTo(x + 26*s, y - 36*s); g.lineTo(x + 32*s, y - 32*s); g.lineTo(x + 26*s, y - 28*s); g.lineTo(x - 2*s, y - 28*s); g.closePath(); g.fill();
        g.beginPath(); g.moveTo(x + 2*s, y - 24*s); g.lineTo(x - 26*s, y - 24*s); g.lineTo(x - 32*s, y - 20*s); g.lineTo(x - 26*s, y - 16*s); g.lineTo(x + 2*s, y - 16*s); g.closePath(); g.fill();
      }
    }});
  });
  // flowers + tufts + man + butterflies into the sort
  flowers.forEach(function(f){
    drawList.push({ z: f.z, f: function(){
      var x = f.x - camX; if (x < -20 || x > W + 20) return;
      var y = gy(f.z), s = zs(f.z);
      var sw = Math.sin(time*1.4 + f.ph) * (1 + wind*2);
      g.strokeStyle = rgba(pal.trees, 0.9); g.lineWidth = 1.3*s;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + sw*s*0.5, y - 5*s, x + sw*s, y - 9*s); g.stroke();
      g.fillStyle = f.c;
      g.beginPath(); g.arc(x + sw*s, y - 10*s, 2.4*s, 0, 6.29); g.fill();
    }});
  });
  bushes.forEach(function(b2){
    drawList.push({ z: b2.z, f: function(){
      var x = b2.x - camX; if (x < -60 || x > W + 60) return;
      var y = gy(b2.z), s = zs(b2.z) * b2.s;
      var sw = Math.sin(time*0.9 + b2.ph) * wind * 1.2;
      g.fillStyle = rgba(pal.trees, 0.92);
      [[0,0,14],[-11,3,9],[11,3,10],[-4,-7,9],[7,-6,8]].forEach(function(c){
        g.beginPath(); g.arc(x + (c[0]+sw)*s, y - (10+c[1])*s + 10*s, c[2]*s, 0, 6.29); g.fill();
      });
    }});
  });
  stones.forEach(function(st){
    drawList.push({ z: st.z, f: function(){
      var x = st.x - camX; if (x < -20 || x > W + 20) return;
      var y = gy(st.z), s = zs(st.z) * st.s;
      g.fillStyle = rgba(pal.ridgeMid, 0.8);
      g.beginPath(); g.ellipse(x, y - 3*s, 7*s, 4.5*s, 0, Math.PI, 0); g.fill();
    }});
  });
  tufts.forEach(function(t2){
    drawList.push({ z: t2.z, f: function(){
      var x = t2.x - camX; if (x < -20 || x > W + 20) return;
      var y = gy(t2.z), s = zs(t2.z) * t2.s;
      var sw = Math.sin(time*1.2 + t2.ph + t2.x*0.01) * (1.5 + wind*2.5);
      g.strokeStyle = rgba(pal.trees, 0.55); g.lineWidth = 1.6*s; g.lineCap = 'round';
      for (var bi = -1; bi <= 1; bi++){
        g.beginPath(); g.moveTo(x + bi*3*s, y);
        g.quadraticCurveTo(x + bi*3*s + sw*s*0.5, y - 7*s, x + bi*4*s + sw*s, y - 13*s);
        g.stroke();
      }
    }});
  });
  butterflies.forEach(function(b){
    if (dark > 0.4) return;
    drawList.push({ z: b.z + 0.01, f: function(){
      var x = b.x - camX; if (x < -20 || x > W + 20) return;
      var y = gy(b.z) - (26 + Math.sin(b.ph)*10) * zs(b.z);
      var s = zs(b.z) * 0.9, w = Math.abs(Math.sin(b.ph*4)) * 3 + 1;
      g.fillStyle = 'rgba(217,164,65,0.95)';
      g.beginPath(); g.ellipse(x - w*s, y, 3*s, 4.4*s, -0.5, 0, 6.29); g.fill();
      g.beginPath(); g.ellipse(x + w*s, y, 3*s, 4.4*s, 0.5, 0, 6.29); g.fill();
    }});
  });
  // the characters
  chars.forEach(function(c){
    drawList.push({ z: c.z + 0.001, f: function(){
      var x = c.x - camX; if (x < -60 || x > W + 60) return;
      var y = gy(c.z) - Math.sin(c.hop*Math.PI)*16*zs(c.z), s = zs(c.z) * 1.3;
      drawMan(x, y, s, c.visFace, c.step, c.mode, false, c.mode === 'forage' ? 0.84 : c.squash, c.stretchAmt, c.tipAmt, c.look, c.hat, c.waveAmt);
      if (Math.abs(c.x - man.x) < 520 || c.state === 'meet'){
        var na = c.state === 'meet' ? 0.7 : 0.28 + 0.5 * (1 - Math.abs(c.x - man.x) / 520);
        g.font = 'italic ' + Math.max(9, Math.round(11 * s)) + 'px Georgia, serif';
        g.textAlign = 'center';
        g.fillStyle = 'rgba(74,64,56,' + na.toFixed(3) + ')';
        g.fillText(c.name, x, y - 62 * s);
      }
    }});
  });
  drawList.sort(function(a,b){ return a.z - b.z; });
  drawList.forEach(function(d){ d.f(); });
  // sawdust over build sites
  buildParts.forEach(function(bp){
    g.fillStyle = 'rgba(190,160,120,' + clamp(bp.life,0,0.6).toFixed(3) + ')';
    g.beginPath(); g.arc(bp.x - camX, gy(bp.z) - 8*zs(bp.z) + bp.y, bp.s, 0, 6.29); g.fill();
  });
  // goods: harvest pops and trades changing hands
  goodsPops.forEach(function(gp2){
    g.globalAlpha = clamp(1.2 - gp2.t, 0, 1);
    drawGood(gp2.kind, gp2.x - camX, gy(gp2.z) - (46 + gp2.t*18) * zs(gp2.z), zs(gp2.z));
    g.globalAlpha = 1;
  });
  tradeFly.forEach(function(tf){
    var k2 = tf.t, ax3 = tf.a.x + (tf.b.x - tf.a.x) * k2, az3 = tf.a.z + (tf.b.z - tf.a.z) * k2;
    var ay3 = gy(az3) - 56 * zs(az3) - Math.sin(k2 * Math.PI) * 22;
    drawGood(tf.kind, ax3 - camX, ay3, zs(az3));
  });

  // foreground blades - big soft framing at the bottom edge
  g.lineCap = 'round';
  for (var fb = 0; fb < 7; fb++){
    var fx2 = ((fb * 977 + 313) % 1000) / 1000 * (W + 160) - 80;
    var fh = 60 + ((fb * 421) % 60);
    var fsw = Math.sin(time*1.1 + fb*1.9) * (3 + wind*5);
    g.strokeStyle = rgba(pal.trees, 0.5);
    g.lineWidth = 7;
    g.beginPath(); g.moveTo(fx2, H + 6);
    g.quadraticCurveTo(fx2 + fsw, H - fh*0.6, fx2 + fsw*2.2, H - fh);
    g.stroke();
  }

  // fireflies (glow on top)
  if (dark > 0.3){
    fireflies.forEach(function(f){
      var x = f.x - camX; if (x < -10 || x > W + 10) return;
      var y = gy(f.z) - (14 + Math.sin(f.ph)*8) * zs(f.z);
      var a = (0.25 + 0.75*Math.abs(Math.sin(f.ph*1.7))) * clamp((dark-0.3)/0.5,0,1);
      var fg2 = g.createRadialGradient(x, y, 0, x, y, 7);
      fg2.addColorStop(0, 'rgba(240,220,130,' + (a*0.9).toFixed(3) + ')');
      fg2.addColorStop(1, 'rgba(240,220,130,0)');
      g.fillStyle = fg2; g.beginPath(); g.arc(x, y, 7, 0, 6.29); g.fill();
    });
  }
  // birds (above everything)
  if (birds.flock){
    var f = birds.flock;
    g.strokeStyle = rgba(pal.trees, 0.85); g.lineWidth = 1.8; g.lineCap = 'round';
    for (var bi2 = 0; bi2 < f.n; bi2++){
      var bx = f.x - camX + bi2*26*f.dir + (bi2%2)*14*f.dir;
      var by = f.y + (bi2%3)*13 + Math.sin(f.ph + bi2)*3;
      var flap = Math.sin(f.ph*2 + bi2) * 4;
      g.beginPath();
      g.moveTo(bx - 7, by + flap); g.quadraticCurveTo(bx, by - 3, bx, by);
      g.quadraticCurveTo(bx, by - 3, bx + 7, by + flap);
      g.stroke();
    }
  }

  // rain veil + streaks (over the world, under the UI)
  if (rain.a > 0.02){
    g.fillStyle = 'rgba(210,220,228,' + (rain.a * 0.10).toFixed(3) + ')';
    g.fillRect(bgX, bgY, bgW, bgH);
    g.strokeStyle = 'rgba(225,235,240,' + (rain.a * 0.28).toFixed(3) + ')';
    g.lineWidth = 1.1; g.lineCap = 'round';
    var slant = 5 + wind * 9;
    for (var ri = 0; ri < 110; ri++){
      var rx2 = ((ri * 137.5) % (W + 60)) - 30;
      var ry2 = ((ri * 211.3 + time * 940) % (H + 50)) - 25;
      g.beginPath(); g.moveTo(rx2, ry2); g.lineTo(rx2 + slant * 0.35, ry2 + 13); g.stroke();
    }
  }
  // owl glide
  if (owl.active){
    var ow = Math.abs(Math.sin(owl.ph)) * 9;
    g.fillStyle = 'rgba(30,28,40,0.9)';
    g.beginPath(); g.ellipse(owl.x, owl.y, 7, 4.5, 0, 0, 6.29); g.fill();
    g.beginPath(); g.arc(owl.x + owl.dir * 6, owl.y - 2, 3.4, 0, 6.29); g.fill();
    g.strokeStyle = 'rgba(30,28,40,0.9)'; g.lineWidth = 3.4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(owl.x, owl.y); g.quadraticCurveTo(owl.x - 12, owl.y - 4, owl.x - 20, owl.y - 2 - ow); g.stroke();
    g.beginPath(); g.moveTo(owl.x, owl.y); g.quadraticCurveTo(owl.x + 12, owl.y - 4, owl.x + 20, owl.y - 2 - ow); g.stroke();
  }

  g.restore();   // end of the zoom lens

  // bubbles follow their owners (through the same lens math)
  chars.forEach(function(c){
    var bb = bubs[c.id];
    if (!bb) return;
    bb.el.style.left = ((c.x - camX - zcx) * zoom + zcx + (c.state === 'meet' ? (c.meetLead ? -22 : 22) : 0)) + 'px';
    bb.el.style.top = ((gy(c.z) - zcy) * zoom + zcy - 96 * zs(c.z) * zoom) + 'px';
  });

  if (DEBUG){
  window.__dock = function(){
    var p = PLACES.filter(function(k){ return k.id === 'dock'; })[0];
    man.state = 'stroll'; man.place = p; man.tx = DOCK.bx; man.tz = DOCK.bz; man.speed = 66; man.pauseUntil = 0;
    man.vias = [ { x: DOCK.approach.x, z: DOCK.approach.z }, { x: DOCK.ax, z: DOCK.az } ];
  };
  window.__tip = function(){ man.hop = 1; man.tipT = 1.3; };
  window.__zoom = function(z){ targetZoom = clamp(z || 1, ZMIN, ZMAX); return targetZoom; };
  window.__zget = function(){ return { zoom: +zoom.toFixed(3), targetZoom: targetZoom, camX: Math.round(camX), manX: Math.round(man.x), W: W, H: H }; };
  window.__sit = function(f){ man.state='sit'; man.pauseUntil = performance.now()+12000; man.vx=0; man.vz=0; if (f){ man.face=f; man.lastFace=f; man.visFace=f; } };
  window.__work = function(id, type){
    var c = man;
    chars.forEach(function(k){ if (k.id === id) c = k; });
    c.workLeg = type || (c.work === 'any' ? 'forage' : c.work);
    var tgt = workTarget(c, c.workLeg);
    c.state = 'stroll'; c.tx = tgt.x; c.tz = tgt.z; c.vias = tgt.vias || []; c.speed = 110; c.place = null;
  };
  window.__bld = function(){
    if (!build.active) return 'idle age=' + Math.round(worldAge) + ' next=' + Math.round(build.nextAt) + ' built=[' + JSON.parse(localStorage.getItem('valley-built')||'[]').join(',') + ']';
    var B = build.active;
    return B.proj.id + ':' + B.stage + ' t=' + B.t.toFixed(0) + ' age=' + Math.round(worldAge) + ' crew=[' + B.crew.map(function(c){ return c.id + '@' + Math.round(c.x) + ',' + c.z.toFixed(2) + ' d=' + Math.round(Math.hypot(c.x - c.buildSpot.x, (c.z - c.buildSpot.z)*900)) + ' ' + c.state; }).join(' | ') + ']';
  };
  window.__civ = function(id){
    var pj = PROJECTS.filter(function(k){ return k.id === id; })[0];
    return pj ? ('ready=' + civReady(pj) + ' done=' + pj.done + ' trades=' + tradeCount + ' stall=' + JSON.stringify(stallStock)) : 'no such project';
  };
  window.__char = function(id){
    var c = man;
    chars.forEach(function(k){ if (k.id === id) c = k; });
    return c.state + ' wl=' + (c.workLeg || '-') + ' sr=' + (c.stockRun ? 1 : 0) + ' @' + Math.round(c.x) + ',' + c.z.toFixed(2) + ' tx=' + Math.round(c.tx || 0) + ',' + (c.tz || 0).toFixed(2) + ' vias=' + (c.vias ? c.vias.length : 0) + ' fish=' + (c.goods.fish || 0) + ' laborT=' + Math.round(c.laborT || 0);
  };
  window.__give = function(id, kind, n){
    var c = man;
    chars.forEach(function(k){ if (k.id === id) c = k; });
    c.goods[kind || 'fish'] = n || 3;
  };
  window.__goods = function(){ return 'stall=' + JSON.stringify(stallStock) + ' | ' + chars.map(function(c){ return c.id + JSON.stringify(c.goods); }).join(' '); };
  window.__build = function(id){
    var pj = PROJECTS.filter(function(k){ return k.id === (id || 'bench') && !k.done; })[0] || PROJECTS.filter(function(k){ return !k.done; })[0];
    if (!pj) return 'all built';
    forcedProject = pj; build.nextAt = -1;
    if (build.active){ build.active.crew.forEach(function(c2){ c2.buildRole = false; }); build.active = null; }
  };
  window.__meet = function(id){
    var o = null;
    chars.forEach(function(c){ if (c.id === id) o = c; });
    if (!o || o === man) o = chars[1];
    pairCd = {}; lastMeet = -1e9;
    if (Math.abs(o.x - man.x) > 400){ o.x = man.x + 260; o.z = clamp(man.z + 0.03, 0.2, 0.88); o.vx = o.vz = 0; }
    o.state = 'stroll'; o.meetWith = null; o.vias = []; o.place = null;
    o.tx = man.x + 40; o.tz = man.z; o.speed = 110;
    man.state = 'pause'; man.pauseUntil = performance.now() + 30000; man.resume = null; man.vx = man.vz = 0;
  };
  }
  window.__dbg = DEBUG ? chars.map(function(c){ return c.id + ':' + c.state + '@' + Math.round(c.x) + ',' + c.z.toFixed(2); }).join(' ') + ' | found=' + found + ' meets=' + meetCount + ' notes=' + noteCount + ' t=' + t.toFixed(2) + ' pd=' + pondD2(man.x, man.z).toFixed(2) : '';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
